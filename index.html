<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Routine</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--txt:#fff;--sub:#8e8e93;--blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--purple:#BF5AF2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 90px}
header{padding:20px 20px 8px;max-width:600px;margin:auto}
h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
h2{font-size:20px;font-weight:600;margin:24px 0 10px}
main{max-width:600px;margin:auto;padding:0 16px}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datenav span{color:var(--sub);text-transform:capitalize;font-size:15px}
.icon-btn{background:var(--card);border:none;color:var(--blue);font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer}
.icon-btn:disabled{opacity:.3}
.ring-card{display:flex;justify-content:center;padding:24px}
.ring{position:relative;width:160px;height:160px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bgc{stroke:var(--card2)}
.ring .fg{stroke:var(--green);transition:stroke-dashoffset .6s ease,stroke .3s}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-size:36px;font-weight:700}.ring-txt small{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer;transition:transform .1s}
.row:active{transform:scale(.98)}
.emoji{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.grow{flex:1;min-width:0}.grow small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.done .check{background:var(--green);border-color:var(--green)}
.done .check::after{content:"✓";color:#000;font-weight:700;font-size:14px}
.done .grow b{color:var(--sub);text-decoration:line-through}
.time{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums;width:92px;flex-shrink:0}
.tag{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
input,select{background:var(--card2);color:var(--txt);border:none;border-radius:10px;padding:10px;font-size:16px;font-family:inherit;width:100%}
.sleep{display:flex;align-items:center;gap:12px}
.sleep input{width:80px;text-align:center}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;background:none;border:none;color:var(--txt);padding:8px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--card2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:var(--txt)}
.mini{background:none;border:none;color:var(--sub);font-size:15px;cursor:pointer;padding:4px 6px}
.mini.del{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{font-size:28px;display:block}.stat small{color:var(--sub);font-size:13px}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar div{height:100%;border-radius:3px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat div{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.heat .lbl{aspect-ratio:auto;color:var(--sub);background:none}
.empty{color:var(--sub);text-align:center;padding:20px;font-size:14px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(28,28,30,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:.5px solid #38383a}
.tabbar button{background:none;border:none;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;width:80px}
.tabbar button span{font-size:22px}
.tabbar button.on{color:var(--blue)}
</style>
</head>
<body>
<header><h1 id="title">Aujourd'hui</h1></header>
<main>
  <!-- AUJOURD'HUI -->
  <section id="v-today" class="view active">
    <div class="datenav">
      <button class="icon-btn" id="prev">‹</button>
      <span id="dateLabel"></span>
      <button class="icon-btn" id="next">›</button>
    </div>
    <div class="card ring-card">
      <div class="ring">
        <svg width="160" height="160"><circle class="bgc" cx="80" cy="80" r="64"/><circle class="fg" id="ringFg" cx="80" cy="80" r="64"/></svg>
        <div class="ring-txt"><b id="scoreTxt">0%</b><small>réussite</small></div>
      </div>
    </div>
    <h2>Habitudes</h2>
    <div id="habitList"></div>
    <div class="card sleep">
      <div class="emoji" style="background:#BF5AF233">🌙</div>
      <div class="grow"><b>Sommeil</b><small>Objectif : <input type="number" id="sleepGoal" step="0.5" min="1" max="12" style="width:60px;padding:4px;font-size:13px"> h</small></div>
      <input type="number" id="sleepInput" step="0.5" min="0" max="24" placeholder="h">
    </div>
    <h2>Programme du jour</h2>
    <div id="dayBlocks"></div>
  </section>

  <!-- PLANNING -->
  <section id="v-plan" class="view">
    <div class="seg" id="planDays"></div>
    <div id="planList"></div>
    <h2 id="formTitle">Ajouter un créneau</h2>
    <div class="card form">
      <input type="time" id="pStart" value="08:00">
      <input type="time" id="pEnd" value="09:00">
      <input class="full" id="pTitle" placeholder="Titre (ex : Lecture 30 pages)">
      <select class="full" id="pHabit"></select>
      <button class="btn full" id="pSave">Ajouter</button>
      <button class="btn ghost full" id="pCancel" style="display:none">Annuler</button>
    </div>
  </section>

  <!-- STATS -->
  <section id="v-stats" class="view">
    <div class="seg" id="periodSeg">
      <button data-p="jour">Jour</button><button data-p="semaine" class="on">Semaine</button><button data-p="mois">Mois</button>
    </div>
    <div class="card"><canvas id="chart" height="220"></canvas></div>
    <div class="grid2">
      <div class="card stat"><b id="sAvg">–</b><small>Score moyen</small></div>
      <div class="card stat"><b id="sSleep">–</b><small>Sommeil moyen</small></div>
      <div class="card stat"><b id="sStreak">–</b><small>🔥 Série actuelle</small></div>
      <div class="card stat"><b id="sBest">–</b><small>🏆 Meilleure série</small></div>
    </div>
    <h2>Par habitude</h2>
    <div class="card" id="habitRates"></div>
    <div id="heatWrap"><h2>Calendrier du mois</h2><div class="card"><div class="heat" id="heat"></div></div></div>
  </section>
</main>

<nav class="tabbar">
  <button data-v="today" class="on"><span>☀️</span>Aujourd'hui</button>
  <button data-v="plan"><span>🗓️</span>Planning</button>
  <button data-v="stats"><span>📊</span>Stats</button>
</nav>

<script>
const HABITS=[
  {id:'lecture',name:'Lecture',icon:'📖',color:'#0A84FF'},
  {id:'muscu',name:'Salle de muscu',icon:'🏋️',color:'#FF453A'},
  {id:'info',name:'Apprentissage info',icon:'💻',color:'#30D158'},
  {id:'travail',name:'Travail personnel',icon:'🎯',color:'#FF9F0A'}
];
const SLEEP_COLOR='#BF5AF2', STORE='routine-v1', SUCCESS=80;
const DAY_ORDER=[1,2,3,4,5,6,0], DAY_SHORT=['D','L','M','M','J','V','S'];

// ---------- Données ----------
function uid(){return Math.random().toString(36).slice(2,9)}
function defaultSchedule(){
  const s={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  [1,2,3,4,5].forEach(d=>{
    s[d].push({id:uid(),start:'07:00',end:'07:30',title:'Lecture',habit:'lecture'});
    s[d].push({id:uid(),start:'20:00',end:'21:00',title:'Apprentissage info',habit:'info'});
    s[d].push({id:uid(),start:'21:00',end:'22:00',title:'Travail personnel',habit:'travail'});
  });
  [1,3,5].forEach(d=>s[d].push({id:uid(),start:'18:00',end:'19:30',title:'Séance muscu',habit:'muscu'}));
  s[6].push({id:uid(),start:'10:00',end:'11:30',title:'Séance muscu',habit:'muscu'});
  return s;
}
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{settings:{sleepGoal:8},schedule:defaultSchedule(),days:{}};
function save(){localStorage.setItem(STORE,JSON.stringify(state))}

const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromKey=k=>new Date(k+'T00:00:00');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const getDay=dk=>state.days[dk]||{habits:{},blocks:{},sleep:null};
const editDay=dk=>state.days[dk]||(state.days[dk]={habits:{},blocks:{},sleep:null});
const blocksOf=dow=>(state.schedule[dow]||[]).slice().sort((a,b)=>a.start.localeCompare(b.start));

function habitDone(dk,hid){
  const d=getDay(dk);
  if(d.habits[hid]) return true;
  return blocksOf(fromKey(dk).getDay()).some(b=>b.habit===hid&&d.blocks[b.id]);
}
function sleepRatio(dk){const s=getDay(dk).sleep;return s?Math.min(s/state.settings.sleepGoal,1):0}
function score(dk){
  const n=HABITS.filter(h=>habitDone(dk,h.id)).length;
  return Math.round((n+sleepRatio(dk))/(HABITS.length+1)*100);
}

// ---------- Aujourd'hui ----------
let sel=today();
function toggleHabit(hid){
  const dk=key(sel), d=editDay(dk);
  if(habitDone(dk,hid)){
    d.habits[hid]=false;
    blocksOf(sel.getDay()).filter(b=>b.habit===hid).forEach(b=>d.blocks[b.id]=false);
  } else d.habits[hid]=true;
  save();renderToday();
}
function toggleBlock(id){const d=editDay(key(sel));d.blocks[id]=!d.blocks[id];save();renderToday()}

function renderToday(){
  const dk=key(sel), dow=sel.getDay(), d=getDay(dk);
  document.getElementById('dateLabel').textContent=sel.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('next').disabled=sel>=today();
  document.getElementById('habitList').innerHTML=HABITS.map(h=>{
    const slots=blocksOf(dow).filter(b=>b.habit===h.id).map(b=>b.start).join(' · ');
    return `<div class="row ${habitDone(dk,h.id)?'done':''}" onclick="toggleHabit('${h.id}')">
      <div class="emoji" style="background:${h.color}33">${h.icon}</div>
      <div class="grow"><b>${h.name}</b><small>${slots?'Prévu à '+slots:'Pas de créneau prévu'}</small></div>
      <div class="check"></div></div>`;
  }).join('');
  document.getElementById('sleepInput').value=d.sleep??'';
  document.getElementById('sleepGoal').value=state.settings.sleepGoal;
  const bl=blocksOf(dow);
  document.getElementById('dayBlocks').innerHTML=bl.length?bl.map(b=>{
    const h=HABITS.find(x=>x.id===b.habit);
    return `<div class="row ${d.blocks[b.id]?'done':''}" onclick="toggleBlock('${b.id}')">
      <div class="time">${b.start} – ${b.end}</div>
      <div class="grow"><b>${esc(b.title)}</b></div>
      ${h?`<span class="tag" style="background:${h.color}33;color:${h.color}">${h.icon}</span>`:''}
      <div class="check"></div></div>`;
  }).join(''):'<div class="empty">Aucun créneau ce jour. Ajoute-en dans Planning.</div>';
  const s=score(dk), C=2*Math.PI*64, fg=document.getElementById('ringFg');
  fg.style.strokeDasharray=C;fg.style.strokeDashoffset=C*(1-s/100);
  fg.style.stroke=s>=SUCCESS?'#30D158':s>=50?'#FF9F0A':'#FF453A';
  document.getElementById('scoreTxt').textContent=s+'%';
}
document.getElementById('prev').onclick=()=>{sel=addDays(sel,-1);renderToday()};
document.getElementById('next').onclick=()=>{if(sel<today()){sel=addDays(sel,1);renderToday()}};
document.getElementById('sleepInput').onchange=e=>{const v=parseFloat(e.target.value);editDay(key(sel)).sleep=isNaN(v)?null:v;save();renderToday()};
document.getElementById('sleepGoal').onchange=e=>{const v=parseFloat(e.target.value);if(v>0){state.settings.sleepGoal=v;save();renderToday()}};
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));

// ---------- Planning ----------
let planDay=today().getDay(), editing=null;
document.getElementById('pHabit').innerHTML='<option value="">— Aucune habitude liée —</option>'+HABITS.map(h=>`<option value="${h.id}">${h.icon} ${h.name}</option>`).join('');
function renderPlan(){
  document.getElementById('planDays').innerHTML=DAY_ORDER.map(d=>`<button class="${d===planDay?'on':''}" onclick="planDay=${d};cancelEdit();renderPlan()">${DAY_SHORT[d]}</button>`).join('');
  const bl=blocksOf(planDay);
  document.getElementById('planList').innerHTML=bl.length?bl.map(b=>{
    const h=HABITS.find(x=>x.id===b.habit);
    return `<div class="row" style="cursor:default">
      <div class="time">${b.start} – ${b.end}</div>
      <div class="grow"><b>${esc(b.title)}</b>${h?`<small style="color:${h.color}">${h.icon} ${h.name}</small>`:''}</div>
      <button class="mini" onclick="startEdit('${b.id}')">✎</button>
      <button class="mini del" onclick="delBlock('${b.id}')">✕</button></div>`;
  }).join(''):'<div class="empty">Aucun créneau pour ce jour.</div>';
}
function startEdit(id){
  const b=state.schedule[planDay].find(x=>x.id===id);editing=id;
  pStart.value=b.start;pEnd.value=b.end;pTitle.value=b.title;pHabit.value=b.habit||'';
  formTitle.textContent='Modifier le créneau';pSave.textContent='Enregistrer';pCancel.style.display='block';
  pTitle.focus();
}
function cancelEdit(){editing=null;pTitle.value='';formTitle.textContent='Ajouter un créneau';pSave.textContent='Ajouter';pCancel.style.display='none'}
function delBlock(id){if(confirm('Supprimer ce créneau ?')){state.schedule[planDay]=state.schedule[planDay].filter(b=>b.id!==id);save();renderPlan()}}
pCancel.onclick=cancelEdit;
pSave.onclick=()=>{
  const title=pTitle.value.trim()||(HABITS.find(h=>h.id===pHabit.value)||{}).name;
  if(!title){alert('Ajoute un titre');return}
  if(pEnd.value<=pStart.value){alert("L'heure de fin doit être après le début");return}
  const data={start:pStart.value,end:pEnd.value,title,habit:pHabit.value||null};
  const list=state.schedule[planDay];
  if(editing) Object.assign(list.find(b=>b.id===editing),data); else list.push({id:uid(),...data});
  save();cancelEdit();renderPlan();
};

// ---------- Stats ----------
let period='semaine', chart;
Chart.defaults.color='#8e8e93';Chart.defaults.borderColor='#2c2c2e';
Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,sans-serif';
document.querySelectorAll('#periodSeg button').forEach(b=>b.onclick=()=>{
  period=b.dataset.p;document.querySelectorAll('#periodSeg button').forEach(x=>x.classList.toggle('on',x===b));renderStats();
});
function streaks(){
  let cur=0,d=today();
  if(score(key(d))<SUCCESS) d=addDays(d,-1);
  while(score(key(d))>=SUCCESS){cur++;d=addDays(d,-1)}
  const keys=Object.keys(state.days).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{
    if(score(k)>=SUCCESS){run=(prev&&key(addDays(fromKey(prev),1))===k)?run+1:1;prev=k;best=Math.max(best,run)}
    else{run=0;prev=null}
  });
  return{cur,best:Math.max(best,cur)};
}
function renderStats(){
  const t=today();let days=[];
  if(period==='jour') days=[key(sel)];
  if(period==='semaine') for(let i=6;i>=0;i--) days.push(key(addDays(t,-i)));
  if(period==='mois'){const n=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();for(let i=1;i<=n;i++){const d=new Date(t.getFullYear(),t.getMonth(),i);if(d<=t)days.push(key(d))}}
  if(chart) chart.destroy();
  const ctx=document.getElementById('chart');
  if(period==='jour'){
    const dk=days[0];
    chart=new Chart(ctx,{type:'bar',data:{labels:[...HABITS.map(h=>h.icon+' '+h.name),'🌙 Sommeil'],
      datasets:[{data:[...HABITS.map(h=>habitDone(dk,h.id)?100:0),Math.round(sleepRatio(dk)*100)],
      backgroundColor:[...HABITS.map(h=>h.color),SLEEP_COLOR],borderRadius:8}]},
      options:{indexAxis:'y',plugins:{legend:{display:false},title:{display:true,text:fromKey(dk).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' — '+score(dk)+' %'}},
      scales:{x:{max:100,ticks:{callback:v=>v+'%'}},y:{grid:{display:false}}}}});
  } else {
    const labels=days.map(k=>period==='semaine'?fromKey(k).toLocaleDateString('fr-FR',{weekday:'short'}):fromKey(k).getDate());
    chart=new Chart(ctx,{data:{labels,datasets:[
      {type:period==='semaine'?'bar':'line',label:'Score %',data:days.map(score),
       backgroundColor:days.map(k=>score(k)>=SUCCESS?'#30D158':score(k)>=50?'#FF9F0A':'#FF453A'),
       borderColor:'#30D158',borderRadius:8,tension:.35,fill:false,pointRadius:3,yAxisID:'y'},
      {type:'line',label:'Sommeil (h)',data:days.map(k=>getDay(k).sleep),borderColor:SLEEP_COLOR,backgroundColor:SLEEP_COLOR,
       tension:.35,pointRadius:3,spanGaps:true,yAxisID:'y1'}]},
      options:{plugins:{legend:{labels:{boxWidth:10,usePointStyle:true}}},
      scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}},y1:{position:'right',min:0,max:12,grid:{display:false},ticks:{callback:v=>v+'h'}},x:{grid:{display:false}}}}});
  }
  const avg=Math.round(days.reduce((a,k)=>a+score(k),0)/days.length);
  const sl=days.map(k=>getDay(k).sleep).filter(Boolean);
  sAvg.textContent=avg+' %';
  sSleep.textContent=sl.length?(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1)+' h':'–';
  const st=streaks();sStreak.textContent=st.cur+' j';sBest.textContent=st.best+' j';
  habitRates.innerHTML=HABITS.map(h=>{
    const r=Math.round(days.filter(k=>habitDone(k,h.id)).length/days.length*100);
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:15px"><span>${h.icon} ${h.name}</span><span style="color:var(--sub)">${r}%</span></div><div class="bar"><div style="width:${r}%;background:${h.color}"></div></div></div>`;
  }).join('');
  heatWrap.style.display=period==='mois'?'block':'none';
  if(period==='mois'){
    const first=new Date(t.getFullYear(),t.getMonth(),1), n=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
    let html=['L','M','M','J','V','S','D'].map(x=>`<div class="lbl">${x}</div>`).join('');
    html+='<div></div>'.repeat((first.getDay()+6)%7);
    for(let i=1;i<=n;i++){
      const d=new Date(t.getFullYear(),t.getMonth(),i);
      if(d>t){html+=`<div style="background:#1c1c1e;color:#48484a">${i}</div>`;continue}
      const s=score(key(d));
      html+=`<div title="${s}%" style="background:${s?`rgba(48,209,88,${.15+s/100*.85})`:'#2c2c2e'}">${i}</div>`;
    }
    heat.innerHTML=html;
  }
}

// ---------- Navigation ----------
const TITLES={today:"Aujourd'hui",plan:'Planning',stats:'Statistiques'};
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+b.dataset.v).classList.add('active');
  title.textContent=TITLES[b.dataset.v];
  ({today:renderToday,plan:renderPlan,stats:renderStats})[b.dataset.v]();
});
renderToday();
</script>
</body>
</html>
