<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeu de la Vie">
<title>Jeu de la Vie</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--muted:#98989f;--text:#f5f5f7;--line:#38383a;--blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--purple:#BF5AF2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
body{min-height:100vh;padding-bottom:96px}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
.app{width:min(100%,620px);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 20px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
header h1{margin:4px 0 22px;font-size:32px;letter-spacing:-.05em}
.view{display:none;animation:rise .3s ease both}.view.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(150deg,#221a2e,#111114 60%);border:1px solid #2e2638;border-radius:28px;padding:24px 20px;margin-bottom:16px;text-align:center}
.avatar{font-size:46px;margin-bottom:6px}
.big-title{font-size:28px;margin:4px 0 14px;letter-spacing:-.04em}
.lvl-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
.lvl-line b{color:var(--text)}
.bar{height:9px;background:#333336;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s ease}
.next{font-size:12px;color:var(--muted);margin-top:10px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mini{background:var(--card);border-radius:18px;padding:14px}
.mini small{display:block;color:var(--muted);font-size:11px}
.mini b{display:block;font-size:24px;margin-top:4px;letter-spacing:-.04em}
.cat-card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px}
.cat-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cat-icon{width:42px;height:42px;border-radius:13px;display:grid;place-content:center;font-size:21px}
.cat-head div{flex:1}
.cat-head strong{display:block;font-size:16px}
.cat-head span{font-size:12px;color:var(--muted)}
.cat-lvl{font-size:22px;font-weight:800;letter-spacing:-.04em}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.section-head h2{font-size:18px;margin:0;letter-spacing:-.02em}
.section-head span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.chip{background:var(--card);color:var(--muted);padding:8px 13px;border-radius:20px;font-size:13px;white-space:nowrap;border:1px solid transparent}
.chip.active{background:#3a3a3c;color:var(--text);border-color:#4a4a4e}
.quest{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:14px;margin-bottom:8px;border-left:4px solid var(--c)}
.quest.done{opacity:.55}
.quest.done .q-name{text-decoration:line-through}
.check{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid #5a5a5e;display:grid;place-content:center;font-weight:900;color:#000;transition:.2s}
.check.on{background:var(--green);border-color:var(--green)}
.q-body{flex:1;min-width:0}
.q-name{font-weight:600;font-size:15px;word-wrap:break-word}
.q-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:11px}
.badge{padding:3px 8px;border-radius:8px;background:#2c2c2e;color:var(--muted)}
.q-xp{font-size:12px;font-weight:700;color:var(--green);white-space:nowrap}
.q-del{color:#6e6e73;font-size:20px;padding:4px 6px}
.undo{background:#303033;border-radius:9px;padding:6px 10px;font-size:12px;color:var(--orange)}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:14px;background:var(--card);border-radius:18px}
.fab{position:fixed;right:max(18px,calc((100vw - 620px)/2 + 18px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--blue);font-size:30px;color:#fff;box-shadow:0 8px 24px rgba(10,132,255,.4);z-index:6;display:none}
.fab.show{display:block}
.segmented{display:flex;background:var(--card);padding:3px;border-radius:12px;margin-bottom:14px}
.segmented button{flex:1;color:var(--muted);border-radius:9px;padding:9px 4px;font-size:13px}
.segmented button.active{background:#3a3a3c;color:var(--text);font-weight:600}
.chart{width:100%;height:190px}
.chart text{fill:#98989f;font-size:11px;font-family:inherit}
.chart line{stroke:#38383a}
.chart-title{font-size:14px;font-weight:700;margin:0 0 12px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.hist small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.plus{color:var(--green);font-weight:700}.minus{color:var(--red);font-weight:700}
.data-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.data-actions button{background:#303033;border-radius:11px;padding:10px 12px;font-size:13px}
.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:rgba(22,22,24,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #29292b;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.bottom-nav button{color:#7d7d82;font-size:10px;display:grid;gap:3px;justify-items:center;padding:3px 20px}
.bottom-nav button span{font-size:22px}
.bottom-nav button.active{color:var(--blue)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1c1c1e;border-radius:26px 26px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));width:min(100%,620px);max-height:92vh;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 16px;font-size:21px}
.label{display:block;color:var(--muted);font-size:12px;margin:16px 0 8px}
.field{width:100%;background:#2c2c2e;border:1px solid transparent;border-radius:12px;padding:12px;color:var(--text)}
.field:focus{outline:none;border-color:var(--blue)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#2c2c2e;border-radius:14px;padding:12px;text-align:left;border:2px solid transparent}
.opt strong{display:block;font-size:14px}
.opt small{color:var(--muted);font-size:11px}
.opt.active{border-color:var(--c);background:#323236}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--blue);font-weight:700;margin-top:18px;color:#fff}
.btn.ghost{background:#2c2c2e;margin-top:8px;color:var(--text)}
.levelup{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:24px}
.levelup.open{display:flex}
.lu-box{text-align:center;max-width:380px;width:100%;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.lu-title{font-size:44px;font-weight:900;letter-spacing:-.04em;background:linear-gradient(90deg,#FFD60A,#FF9F0A,#BF5AF2);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 18px}
.lu-line{background:var(--card);border-radius:16px;padding:14px;margin-bottom:8px;font-size:15px}
.lu-line small{display:block;color:var(--orange);margin-top:5px;font-size:13px;font-weight:600}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:#3a3a3c;border-radius:20px;padding:10px 16px;font-size:13px;z-index:40;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="app">
  <header><div class="eyebrow">Jeu de la Vie</div><h1 id="pageTitle">Profil</h1></header>
  <section id="profileView" class="view active"></section>
  <section id="questsView" class="view"></section>
  <section id="statsView" class="view"></section>
</main>

<button class="fab" id="fab" data-action="new" aria-label="Créer une quête">＋</button>

<nav class="bottom-nav">
  <button data-action="nav" data-view="profile" class="active"><span>👤</span>Profil</button>
  <button data-action="nav" data-view="quests"><span>⚔️</span>Quêtes</button>
  <button data-action="nav" data-view="stats"><span>📊</span>Stats</button>
</nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="levelup" id="levelup"><div class="lu-box" id="luBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
(() => {
'use strict';

/* ===== CONFIGURATION ===== */
const CATS = {
  sport: {name:'Sport',        icon:'🏋️', color:'#FF453A'},
  medit: {name:'Méditation',   icon:'🧘', color:'#64D2FF'},
  philo: {name:'Philosophie',  icon:'📜', color:'#FF9F0A'},
  elec:  {name:'Électronique', icon:'⚡', color:'#FFD60A'}
};
const OVERALL = {name:'Overall', icon:'🌟', color:'#BF5AF2'};
const DIFF = {
  daily:  {name:'Journalière', xp:10,  color:'#30D158', desc:'Revient chaque jour'},
  common: {name:'Commune',     xp:25,  color:'#0A84FF', desc:'Une seule fois'},
  epic:   {name:'Épique',      xp:75,  color:'#BF5AF2', desc:'Une seule fois'},
  legend: {name:'Légendaire',  xp:200, color:'#FF9F0A', desc:'Une seule fois'}
};
const PENALTY = 5;
const TITLES = {
  sport:  ['Débutant','Échauffé','Athlète amateur','Combattant','Gladiateur','Spartiate','Champion','Titan','Olympien','Héraclès','Dieu de l’Olympe'],
  medit:  ['Esprit agité','Apprenti du souffle','Observateur','Calme intérieur','Moine','Ermite','Sage serein','Maître zen','Éveillé','Bodhisattva','Bouddha'],
  philo:  ['Curieux','Questionneur','Disciple','Sophiste','Stoïcien','Penseur','Métaphysicien','Philosophe-roi','Marc Aurèle','Platon','Socrate'],
  elec:   ['Novice du fer à souder','Bricoleur','Soudeur','Bidouilleur Arduino','Maker','Ingénieur','Architecte de circuits','Maître des signaux','Inventeur','Edison','Nikola Tesla'],
  overall:['Vagabond','Aventurier','Éclaireur','Chevalier','Champion','Héros','Seigneur','Légende','Mythe','Demi-dieu','Maître de sa vie']
};
const KEYS = ['overall','sport','medit','philo','elec'];

/* ===== OUTILS ===== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const addDays = (k,n) => { const d = new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return keyOf(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));
const info = k => k==='overall' ? OVERALL : CATS[k];
const fmtDate = k => new Date(k+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});

function toast(t){ const el= $ ('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

/* ===== DONNÉES ===== */
const STORE = 'jeu-de-la-vie';
function freshState(){
  const t = todayKey();
  const q = (name,diff,cats) => ({id:uid(),name,diff,cats,created:t,done:false,doneDates:[]});
  return {
    xp:{overall:0,sport:0,medit:0,philo:0,elec:0},
    log:[], lastCheck:t,
    quests:[
      q('Séance de musculation','daily',['sport']),
      q('Méditer 10 minutes','daily',['medit']),
      q('Lire 20 pages de philosophie','daily',['philo']),
      q('30 min d’électronique','daily',['elec']),
      q('Monter un circuit Arduino','epic',['elec']),
      q('Courir un semi-marathon','legend',['sport','medit'])
    ]
  };
}
let state;
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const p = JSON.parse(raw);
      state = {xp:Object.assign({overall:0,sport:0,medit:0,philo:0,elec:0},p.xp||{}),log:p.log||[],quests:p.quests||[],lastCheck:p.lastCheck||todayKey()};
    } else state = freshState();
  }catch(e){ state = freshState(); }
  save();
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){ toast('Sauvegarde impossible'); } }

/* ===== LOGIQUE XP ===== */
function split(amount, cats){
  const r = {overall:amount};
  const each = cats.length === 2 ? Math.round(amount*0.6) : amount;
  cats.forEach(c => r[c] = each);
  return r;
}
function applyDelta(amounts, sign){
  for(const k in amounts) state.xp[k] = Math.max(0, (state.xp[k]||0) + sign*amounts[k]);
}
function levelInfo(xp, mult){
  let lvl = 1, rem = xp;
  while(lvl < 100){
    const need = (40 + 8*lvl) * mult;
    if(rem < need) return {lvl, cur:rem, need, max:false};
    rem -= need; lvl++;
  }
  return {lvl:100, cur:0, need:0, max:true};
}
const lvlOf = k => levelInfo(state.xp[k], k==='overall'?3:1);
const titleIdx = lvl => Math.min(10, Math.floor(lvl/10));
const titleFor = (k,lvl) => TITLES[k][titleIdx(lvl)];
function nextTitle(k,lvl){ const i = titleIdx(lvl)+1; return i>10 ? null : {name:TITLES[k][i], lvl:i*10}; }

const isDoneToday = q => q.diff==='daily' ? q.doneDates.includes(todayKey()) : q.done;

function snapshot(){ const s={}; KEYS.forEach(k=>s[k]=lvlOf(k).lvl); return s; }

function complete(q){
  const before = snapshot();
  const amounts = split(DIFF[q.diff].xp, q.cats);
  applyDelta(amounts, 1);
  if(q.diff==='daily') q.doneDates.push(todayKey());
  else q.done = true;
  state.log.push({id:uid(), type:'gain', date:todayKey(), qid:q.id, name:q.name, amounts});
  save();
  toast(`+ $ {amounts.overall} XP · ${q.name}`);
  checkLevelUp(before);
}
function undo(q){
  let idx = -1;
  for(let i=state.log.length-1;i>=0;i--){
    const e = state.log[i];
    if(e.type==='gain' && e.qid===q.id && (q.diff!=='daily' || e.date===todayKey())){ idx=i; break; }
  }
  if(idx>=0){ applyDelta(state.log[idx].amounts, -1); state.log.splice(idx,1); }
  if(q.diff==='daily') q.doneDates = q.doneDates.filter(d => d!==todayKey());
  else q.done = false;
  save(); toast('Quête annulée');
}

function checkLevelUp(before){
  const after = snapshot(), lines = [];
  KEYS.forEach(k => {
    if(after[k] > before[k]){
      const newTitle = titleIdx(after[k]) > titleIdx(before[k]) ? titleFor(k,after[k]) : null;
      lines.push(`<div class="lu-line">${info(k).icon} <b>${info(k).name}</b> → Niveau ${after[k]}${newTitle?`<small>👑 Nouveau titre : ${esc(newTitle)}</small>`:''}</div>`);
    }
  });
  if(!lines.length) return;
   $ ('#luBox').innerHTML = `<div style="font-size:54px">🎉</div><div class="lu-title">LEVEL UP !</div> $ {lines.join('')}<button class="btn" data-action="close-lu">Continuer</button>`;
   $ ('#levelup').classList.add('open');
}

/* Pénalités : quêtes journalières non faites les jours précédents */
function applyPenalties(){
  const today = todayKey();
  let d = state.lastCheck || today, total = 0, count = 0, guard = 0;
  while(d < today && guard < 60){
    state.quests.filter(q => q.diff==='daily' && q.created <= d && !q.doneDates.includes(d)).forEach(q => {
      const amounts = split(PENALTY, q.cats);
      applyDelta(amounts, -1);
      state.log.push({id:uid(), type:'penalty', date:d, qid:q.id, name:q.name, amounts});
      total += amounts.overall; count++;
    });
    d = addDays(d,1); guard++;
  }
  state.lastCheck = today;
  save();
  if(count) toast(`⚠️ − $ {total} XP : ${count} quête${count>1?'s':''} journalière${count>1?'s':''} manquée${count>1?'s':''}`);
  return count;
}

/* ===== AFFICHAGE ===== */
let view = 'profile', filter = 'all', statMode = 'week';

function render(){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('#'+view+'View').classList.add('active');
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.view===view));
  $('#pageTitle').textContent = {profile:'Profil', quests:'Quêtes', stats:'Statistiques'}[view];
   $ ('#fab').classList.toggle('show', view==='quests');
  if(view==='profile') renderProfile();
  if(view==='quests') renderQuests();
  if(view==='stats') renderStats();
}

function barHTML(l, color){
  const pct = l.max ? 100 : Math.min(100, l.cur/l.need*100);
  return `<div class="bar"><i style="width: $ {pct}%;background:${color}"></i></div>`;
}

function renderProfile(){
  const o = lvlOf('overall'), nt = nextTitle('overall', o.lvl);
  const dailies = state.quests.filter(q => q.diff==='daily');
  const doneD = dailies.filter(isDoneToday).length;
   $ ('#profileView').innerHTML = `
    <div class="hero">
      <div class="avatar">🌟</div>
      <div class="eyebrow">Titre principal</div>
      <h2 class="big-title"> $ {esc(titleFor('overall',o.lvl))}</h2>
      <div class="lvl-line"><b>Niveau ${o.lvl}</b><span>${o.max?'NIVEAU MAX':`${o.cur} / ${o.need} XP`}</span></div>
      ${barHTML(o, OVERALL.color)}
      <div class="next">${nt?`Prochain titre : <b>${esc(nt.name)}</b> au niveau ${nt.lvl}`:'Tous les titres débloqués 👑'}</div>
    </div>
    <div class="summary">
      <div class="mini"><small>Journalières du jour</small><b>${doneD} / ${dailies.length}</b></div>
      <div class="mini"><small>XP aujourd’hui</small><b>${netXP(todayKey())>=0?'+':''}${netXP(todayKey())}</b></div>
    </div>
    <div class="section-head"><h2>Centres d’intérêt</h2><span>Titre tous les 10 niveaux</span></div>
    ${Object.keys(CATS).map(k => {
      const c = CATS[k], l = lvlOf(k), n = nextTitle(k, l.lvl);
      return `<div class="cat-card">
        <div class="cat-head">
          <div class="cat-icon" style="background:${c.color}22">${c.icon}</div>
          <div><strong>${c.name}</strong><span>${esc(titleFor(k,l.lvl))}</span></div>
          <div class="cat-lvl" style="color:${c.color}">${l.lvl}</div>
        </div>
        ${barHTML(l, c.color)}
        <div class="lvl-line" style="margin:8px 0 0"><span>${l.max?'MAX':`${l.cur} / ${l.need} XP`}</span><span>${n?`→ ${esc(n.name)} (niv ${n.lvl})`:'👑'}</span></div>
      </div>`;
    }).join('')}`;
}

function questRow(q){
  const d = DIFF[q.diff], done = isDoneToday(q), gain = split(d.xp, q.cats);
  const oneTimeDone = q.diff!=='daily' && q.done;
  return `<div class="quest ${done?'done':''}" style="--c:${d.color}">
    ${oneTimeDone ? '' : `<button class="check ${done?'on':''}" data-action="toggle" data-id="${q.id}" aria-label="Valider">${done?'✓':''}</button>`}
    <div class="q-body">
      <div class="q-name">${esc(q.name)}</div>
      <div class="q-meta">
        <span class="badge" style="color:${d.color}">${d.name}</span>
        ${q.cats.map(c => `<span class="badge">${CATS[c].icon} ${CATS[c].name} +${gain[c]}</span>`).join('')}
      </div>
    </div>
    ${oneTimeDone ? `<button class="undo" data-action="toggle" data-id="${q.id}">Annuler</button>` : `<span class="q-xp">+${d.xp} XP</span>`}
    <button class="q-del" data-action="delete" data-id="${q.id}" aria-label="Supprimer">×</button>
  </div>`;
}

function renderQuests(){
  const list = state.quests.filter(q => filter==='all' || q.cats.includes(filter));
  const order = {legend:0, epic:1, common:2};
  const dailies = list.filter(q => q.diff==='daily');
  const active = list.filter(q => q.diff!=='daily' && !q.done).sort((a,b) => order[a.diff]-order[b.diff]);
  const finished = list.filter(q => q.diff!=='daily' && q.done);
  const doneD = dailies.filter(isDoneToday).length;
  $('#questsView').innerHTML = `
    <div class="chips">
      <button class="chip ${filter==='all'?'active':''}" data-action="filter" data-f="all">Toutes</button>
      ${Object.keys(CATS).map(k => `<button class="chip ${filter===k?'active':''}" data-action="filter" data-f="${k}">${CATS[k].icon} ${CATS[k].name}</button>`).join('')}
    </div>
    <div class="section-head"><h2>Journalières</h2><span>${doneD}/${dailies.length} · −${PENALTY} XP si manquée</span></div>
    ${dailies.length ? dailies.map(questRow).join('') : '<div class="empty">Aucune quête journalière.</div>'}
    <div class="section-head"><h2>Quêtes en cours</h2><span>${active.length}</span></div>
    ${active.length ? active.map(questRow).join('') : '<div class="empty">Aucune quête en cours. Appuie sur ＋</div>'}
    ${finished.length ? `<div class="section-head"><h2>Accomplies</h2><span>${finished.length}</span></div>${finished.slice().reverse().map(questRow).join('')}` : ''}
    <div style="height:70px"></div>`;
}

function netXP(k){
  return state.log.filter(e => e.date===k).reduce((s,e) => s + (e.type==='gain' ? e.amounts.overall : -e.amounts.overall), 0);
}
function gainXP(k, cat='overall'){
  return state.log.filter(e => e.date===k && e.type==='gain').reduce((s,e) => s + (e.amounts[cat]||0), 0);
}
function streak(){
  let d = todayKey(), n = 0;
  if(gainXP(d) === 0) d = addDays(d,-1);
  while(gainXP(d) > 0 && n < 3650){ n++; d = addDays(d,-1); }
  return n;
}
function chart(labels, vals, colors){
  const W=560, H=190, p=26, max=Math.max(10, ...vals), gap=(W-p*2)/vals.length, bw=Math.max(2, Math.min(36, gap-6));
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/>`;
  vals.forEach((v,i) => {
    const h=(H-p*2)*v/max, x=p+gap*i+(gap-bw)/2, y=H-p-h;
    out += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,h)}" rx="4" fill="${colors?colors[i]:OVERALL.color}"/>`;
    if(v>0 && vals.length<=12) out += `<text x="${x+bw/2}" y="${y-5}" text-anchor="middle">${v}</text>`;
    if(labels[i]) out += `<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`;
  });
  return out + '</svg>';
}

function renderStats(){
  let title, chartHTML;
  if(statMode==='day'){
    const ks = Object.keys(CATS);
    title = 'XP gagnée aujourd’hui par catégorie';
    chartHTML = chart(ks.map(k=>CATS[k].icon), ks.map(k=>gainXP(todayKey(),k)), ks.map(k=>CATS[k].color));
  } else if(statMode==='week'){
    const ds=[]; for(let i=6;i>=0;i--) ds.push(addDays(todayKey(),-i));
    title = 'XP des 7 derniers jours';
    chartHTML = chart(ds.map(d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short'}).slice(0,3)), ds.map(d=>gainXP(d)));
  } else {
    const ds=[]; for(let i=29;i>=0;i--) ds.push(addDays(todayKey(),-i));
    title = 'XP des 30 derniers jours';
    chartHTML = chart(ds.map((d,i)=>i%5===4?String(new Date(d+'T12:00:00').getDate()):''), ds.map(d=>gainXP(d)));
  }
  const totalQ = state.log.filter(e=>e.type==='gain').length;
  const pen = state.log.filter(e=>e.type==='penalty').reduce((s,e)=>s+e.amounts.overall,0);
  const hist = state.log.slice(-40).reverse();
  $('#statsView').innerHTML = `
    <div class="summary">
      <div class="mini"><small>Série active 🔥</small><b>${streak()} j</b></div>
      <div class="mini"><small>XP totale</small><b>${state.xp.overall}</b></div>
      <div class="mini"><small>Quêtes validées</small><b>${totalQ}</b></div>
      <div class="mini"><small>Pénalités</small><b style="color:var(--red)">−${pen}</b></div>
    </div>
    <div class="segmented">${[['day','Jour'],['week','Semaine'],['month','Mois']].map(([k,l])=>`<button class="${statMode===k?'active':''}" data-action="stat" data-m="${k}">${l}</button>`).join('')}</div>
    <div class="card"><h3 class="chart-title">${title}</h3>${chartHTML}</div>
    <div class="card"><h3 class="chart-title">Historique</h3>
      ${hist.length ? hist.map(e=>`<div class="hist"><div>${esc(e.name)}<small>${fmtDate(e.date)} · ${e.type==='gain'?'Quête accomplie':'Journalière manquée'}</small></div><span class="${e.type==='gain'?'plus':'minus'}">${e.type==='gain'?'+':'−'}${e.amounts.overall}</span></div>`).join('') : '<div class="empty">Aucune activité pour l’instant.</div>'}
    </div>
    <div class="card"><h3 class="chart-title">Sauvegarde</h3>
      <div class="data-actions"><button data-action="export">↗ Exporter</button><button data-action="import">↙ Importer</button><button data-action="reset" style="color:var(--red)">Réinitialiser</button></div>
    </div>`;
}

/* ===== CRÉATION DE QUÊTE ===== */
let form = {};
function openNew(){ form = {name:'', diff:'daily', cats:[]}; drawModal(); $('#modalBg').classList.add('open'); }
function drawModal(){
  $('#modal').innerHTML = `<h2>Nouvelle quête</h2>
    <label class="label">Nom</label>
    <input class="field" id="qName" maxlength="80" placeholder="Ex. 50 pompes" value="${esc(form.name)}">
    <label class="label">Difficulté</label>
    <div class="opt-grid">${Object.keys(DIFF).map(k=>`<button class="opt ${form.diff===k?'active':''}" style="--c:${DIFF[k].color}" data-action="pick-diff" data-k="${k}"><strong style="color:${DIFF[k].color}">${DIFF[k].name}</strong><small>${DIFF[k].xp} XP · ${DIFF[k].desc}</small></button>`).join('')}</div>
    <label class="label">Centres d’intérêt (1 ou 2)</label>
    <div class="opt-grid">${Object.keys(CATS).map(k=>`<button class="opt ${form.cats.includes(k)?'active':''}" style="--c:${CATS[k].color}" data-action="pick-cat" data-k="${k}"><strong>${CATS[k].icon} ${CATS[k].name}</strong></button>`).join('')}</div>
    <button class="btn" data-action="save-quest">Créer la quête</button>
    <button class="btn ghost" data-action="close-modal">Annuler</button>`;
}
function closeModal(){ $('#modalBg').classList.remove('open'); }

/* ===== CLICS ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if(!b){ if(e.target.id==='modalBg') closeModal(); return; }
  const a = b.dataset.action, q = state.quests.find(x => x.id===b.dataset.id);
  switch(a){
    case 'nav': view = b.dataset.view; render(); break;
    case 'filter': filter = b.dataset.f; render(); break;
    case 'stat': statMode = b.dataset.m; render(); break;
    case 'new': openNew(); break;
    case 'toggle': if(q){ isDoneToday(q) ? undo(q) : complete(q); render(); } break;
    case 'delete':
      if(q && confirm(`Supprimer « ${q.name} » ?`)){ state.quests = state.quests.filter(x => x!==q); save(); render(); toast('Quête supprimée'); }
      break;
    case 'pick-diff': form.name = $('#qName').value; form.diff = b.dataset.k; drawModal(); break;
    case 'pick-cat': {
      form.name = $('#qName').value; const k = b.dataset.k;
      if(form.cats.includes(k)) form.cats = form.cats.filter(c => c!==k);
      else if(form.cats.length < 2) form.cats.push(k);
      else toast('2 catégories maximum');
      drawModal(); break;
    }
    case 'save-quest': {
      const name = $('#qName').value.trim();
      if(!name){ toast('Donne un nom à ta quête'); break; }
      if(!form.cats.length){ toast('Choisis au moins une catégorie'); break; }
      state.quests.push({id:uid(), name, diff:form.diff, cats:form.cats.slice(), created:todayKey(), done:false, doneDates:[]});
      save(); closeModal(); render(); toast('Quête créée ⚔️'); break;
    }
    case 'close-modal': closeModal(); break;
    case 'close-lu': $('#levelup').classList.remove('open'); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset':
      if(confirm('Tout effacer ? Cette action est définitive.')){ state = freshState(); save(); render(); toast('Partie réinitialisée'); }
      break;
  }
});

/* ===== SAUVEGARDE ===== */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `jeu-de-la-vie-${todayKey()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Sauvegarde exportée');
}
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      if(!p.xp || !Array.isArray(p.quests)) throw 0;
      localStorage.setItem(STORE, JSON.stringify(p)); load(); render(); toast('Import réussi ✅');
    }catch(err){ toast('Fichier invalide'); }
  };
  r.readAsText(f); e.target.value = '';
});

/* Changement de jour pendant que l'appli est ouverte */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && state.lastCheck !== todayKey()){ applyPenalties(); render(); }
});

/* ===== DÉMARRAGE ===== */
load(); applyPenalties(); render();
})();
</script>
</body>
