<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1220">
<title>Jeu de la vie</title>
<style>
:root{
  --bg:#0f1220; --card:#181c30; --card2:#20253d; --line:#2c3252;
  --txt:#e8eaf6; --mut:#8a90b4; --acc:#7c5cff; --ok:#3ecf8e; --bad:#ff5c6c;
  --c-sport:#ff7a45; --c-meditation:#4cc9f0; --c-philosophie:#b388ff; --c-electronique:#ffd23f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding-bottom:84px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}

header{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header .date{font-size:12px;color:var(--mut);margin-top:2px}
.hbtns{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:12px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:18px}
.ibtn.acc{background:var(--acc)}

main{padding:14px 16px;max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}

.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:14px}

.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;border-radius:99px;transition:width .35s;background:var(--acc)}

.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav h2{margin:0;font-size:18px}
.daynav button{width:38px;height:38px;border-radius:10px;background:var(--card);font-size:16px}

.q{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);
  border-radius:12px;margin-bottom:8px}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent}
.q.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.q.done .qt{text-decoration:line-through;color:var(--mut)}
.qb{flex:1;min-width:0}
.qt{font-weight:600;word-break:break-word}
.qm{font-size:12px;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.xp{font-weight:700;color:var(--ok);font-size:13px;flex:none}
.q .more{width:32px;height:32px;border-radius:8px;color:var(--mut);font-size:18px;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;text-transform:uppercase}
.t-journaliere{background:#2a3f66;color:#8ec5ff}
.t-commune{background:#2e3b2e;color:#9be39b}
.t-epique{background:#3d2a5c;color:#c9a0ff}
.t-legendaire{background:#5c4410;color:#ffd166}

.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;
  margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;padding:9px 10px;border-radius:9px;font-size:13px;
  color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}

.pname{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pname h2{margin:0;font-size:22px}
.lvbig{text-align:center;padding:6px 0 4px}
.lvbig .n{font-size:46px;font-weight:800;line-height:1}
.lvbig .t{color:var(--mut);margin-top:4px}
.stat{margin-bottom:14px}
.stat .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stat .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.stat .lv{font-size:12px;color:var(--mut)}
.small{font-size:11px;color:var(--mut);margin-top:4px}

.slot{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card2);
  border-radius:12px;margin-bottom:8px}
.slot .h{font-weight:700;min-width:96px;font-size:13px}
.slot .l{flex:1}
.slot .x{color:var(--bad);width:30px;height:30px}
.days{display:flex;gap:4px;margin-bottom:12px}
.days button{flex:1;padding:9px 0;border-radius:9px;background:var(--card);
  font-size:12px;color:var(--mut)}
.days button.on{background:var(--acc);color:#fff;font-weight:700}

canvas{width:100%;height:220px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}

.btn{padding:12px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;width:100%}
.btn.sec{background:var(--card2);color:var(--txt)}
.btn.bad{background:var(--bad)}
.row2{display:flex;gap:8px;margin-top:14px}
.row2>*{flex:1}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 9px;font-size:11px;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .i{font-size:20px}
nav button.on{color:var(--acc);font-weight:700}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;
  display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.modal{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 16px 24px}
.modal h2{margin:0 0 4px;font-size:18px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--card2);padding:10px 16px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;border:1px solid var(--line)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="hName">Jeu de la vie</h1>
    <div class="date" id="headDate"></div>
  </div>
  <div class="hbtns">
    <button class="ibtn acc" id="btnAdd" title="Nouvelle quête">＋</button>
    <button class="ibtn" id="btnSettings" title="Réglages">⚙</button>
  </div>
</header>

<main>
  <!-- AUJOURD'HUI -->
  <section class="view on" id="v-today">
    <div class="daynav">
      <button id="dayPrev">◀</button>
      <h2 id="todayTitle">Aujourd'hui</h2>
      <button id="dayNext">▶</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span id="dayProgress" style="font-size:13px;color:var(--mut)">0 / 0</span>
      </div>
      <div class="bar"><div id="dayBar" style="width:0%"></div></div>
    </div>
    <div class="card"><h3>Quêtes journalières</h3><div id="dailyList"></div></div>
    <div class="card"><h3>Planning du jour</h3><div id="todaySchedule"></div></div>
  </section>

  <!-- QUÊTES -->
  <section class="view" id="v-quests">
    <div class="seg" id="questSeg">
      <button data-f="commune" class="on">Communes</button>
      <button data-f="epique">Épiques</button>
      <button data-f="legendaire">Légendaires</button>
      <button data-f="archives">Archives</button>
    </div>
    <div id="questList"></div>
  </section>

  <!-- PROFIL -->
  <section class="view" id="v-profile">
    <div id="profileBox"></div>
  </section>

  <!-- STATS -->
  <section class="view" id="v-stats">
    <div class="seg" id="rangeSeg">
      <button data-r="7" class="on">Semaine</button>
      <button data-r="30">Mois</button>
      <button data-r="90">3 mois</button>
      <button data-r="365">Année</button>
    </div>
    <div class="card">
      <h3>XP gagné</h3>
      <canvas id="chart"></canvas>
      <div class="legend" id="chartLegend"></div>
    </div>
    <div class="card"><h3>Résumé</h3><div id="statsSummary"></div></div>
  </section>

  <!-- PLANNING -->
  <section class="view" id="v-plan">
    <div class="days" id="schedDays"></div>
    <div class="card">
      <h3>Créneaux</h3>
      <div id="schedList"></div>
      <div class="row2"><button class="btn sec" id="btnAddSlot">＋ Ajouter un créneau</button></div>
    </div>
    <div class="card">
      <h3>Sommeil</h3>
      <div id="sleepBox"></div>
    </div>
  </section>
</main>

<nav id="nav">
  <button data-v="today" class="on"><span class="i">☀</span>Aujourd'hui</button>
  <button data-v="quests"><span class="i">⚔</span>Quêtes</button>
  <button data-v="profile"><span class="i">👤</span>Profil</button>
  <button data-v="stats"><span class="i">📊</span>Stats</button>
  <button data-v="plan"><span class="i">🗓</span>Planning</button>
</nav>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
/* ================================================================
   CONSTANTES
   ================================================================ */
var STORE_KEY = 'jdv_data_v2';
var OLD_KEYS = ['jdv_data','jeudelavie','jdv','gameOfLife','lifeGame','jdv_data_v1'];
var PENALTY = 5;

var TYPES = {
  journaliere:{label:'Journalière',css:'t-journaliere'},
  commune:{label:'Commune',css:'t-commune'},
  epique:{label:'Épique',css:'t-epique'},
  legendaire:{label:'Légendaire',css:'t-legendaire'}
};
var STATS = {
  sport:{label:'Sport',color:'var(--c-sport)',hex:'#ff7a45'},
  meditation:{label:'Méditation',color:'var(--c-meditation)',hex:'#4cc9f0'},
  philosophie:{label:'Philosophie',color:'var(--c-philosophie)',hex:'#b388ff'},
  electronique:{label:'Électronique',color:'var(--c-electronique)',hex:'#ffd23f'}
};
var STAT_KEYS = ['sport','meditation','philosophie','electronique'];
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var JOURS_C = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ================================================================
   OUTILS
   ================================================================ */
function el(id){ return document.getElementById(id); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseKey(k){ var p=k.split('-'); return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10)); }
function addDays(k,n){ var d=parseKey(k); d.setDate(d.getDate()+n); return dateKey(d); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"'); }
function toast(msg){
  var t=el('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); },2200);
}
function dateFr(d){ return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]; }
function tag(q){ return '<span class="tag '+TYPES[q.type].css+'">'+TYPES[q.type].label+'</span>'; }
function dot(stat){ return '<span class="dot" style="background:'+STATS[stat].color+'"></span>'; }

/* ================================================================
   DONNÉES
   ================================================================ */
var state = null;

function defaultState(){
  var sched = {};
  for(var i=0;i<7;i++) sched[i]=[];
  return {
    version:2,
    player:'Joueur',
    quests:[],
    log:[],
    schedule:sched,
    sleep:{bed:'23:00',wake:'07:00'},
    lastPenaltyCheck:dateKey()
  };
}

function save(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(state)); }catch(e){ toast('Sauvegarde impossible'); }
}

function mapOldType(t){
  t=String(t||'').toLowerCase();
  if(t==='journaliere'||t==='journalière'||t==='daily') return 'journaliere';
  if(t==='epique'||t==='épique'||t==='dure'||t==='hard') return 'epique';
  if(t==='legendaire'||t==='légendaire'||t==='difficile') return 'legendaire';
  return 'commune';
}
function mapStat(s){
  s=String(s||'').toLowerCase().replace(/é/g,'e').replace(/è/g,'e');
  for(var i=0;i<STAT_KEYS.length;i++){ if(s.indexOf(STAT_KEYS[i])===0) return STAT_KEYS[i]; }
  return 'sport';
}

function normalize(raw){
  var s=defaultState();
  if(!raw||typeof raw!=='object') return s;
  s.player = raw.player || raw.name || raw.playerName || raw.nom || 'Joueur';
  var qs = raw.quests || raw.quetes || raw.tasks || [];
  if(!Array.isArray(qs)) qs=[];
  for(var i=0;i<qs.length;i++){
    var q=qs[i]; if(!q) continue;
    var type = mapOldType(q.type || q.difficulty || q.difficulte);
    s.quests.push({
      id:q.id||uid(),
      title:String(q.title||q.nom||q.name||'Quête'),
      type:type,
      stat:mapStat(q.stat||q.category||q.categorie||q.theme),
      xp:Math.max(0,parseInt(q.xp||q.points||10,10)||10),
      done:!!q.done,
      archived:!!q.archived,
      created:q.created||dateKey(),
      doneDates:Array.isArray(q.doneDates)?q.doneDates:[],
      ar:Array.isArray(q.ar)?q.ar:[]
    });
  }
  if(Array.isArray(raw.log)){
    for(var j=0;j<raw.log.length;j++){
      var l=raw.log[j];
      if(l&&l.date) s.log.push({date:l.date,stat:mapStat(l.stat),xp:parseInt(l.xp,10)||0,title:l.title||''});
    }
  }
  if(raw.schedule&&typeof raw.schedule==='object'){
    for(var d=0;d<7;d++){
      if(Array.isArray(raw.schedule[d])) s.schedule[d]=raw.schedule[d];
    }
  }
  if(raw.sleep&&raw.sleep.bed) s.sleep={bed:raw.sleep.bed,wake:raw.sleep.wake||'07:00'};
  s.lastPenaltyCheck = raw.lastPenaltyCheck || dateKey();
  return s;
}

function load(){
  var raw=null;
  try{ raw=localStorage.getItem(STORE_KEY); }catch(e){}
  if(raw){
    try{ state=normalize(JSON.parse(raw)); return; }catch(e){}
  }
  for(var i=0;i<OLD_KEYS.length;i++){
    try{
      var o=localStorage.getItem(OLD_KEYS[i]);
      if(o){
        state=normalize(JSON.parse(o));
        save();
        setTimeout(function(){ toast('Anciennes données converties ✓'); },600);
        return;
      }
    }catch(e){}
  }
  state=defaultState();
  save();
}

/* ================================================================
   XP / NIVEAUX
   ================================================================ */
function totalXP(stat){
  var t=0;
  for(var i=0;i<state.log.length;i++){ if(state.log[i].stat===stat) t+=state.log[i].xp; }
  return Math.max(0,t);
}
function levelFromXP(xp){
  var lvl=1,need=100,left=xp;
  while(left>=need){ left-=need; lvl++; need=100+50*(lvl-1); }
  return {level:lvl,into:left,need:need};
}
function titleForLevel(l){
  if(l>=50) return 'Légende vivante';
  if(l>=40) return 'Grand maître';
  if(l>=30) return 'Maître';
  if(l>=25) return 'Expert';
  if(l>=20) return 'Vétéran';
  if(l>=15) return 'Confirmé';
  if(l>=10) return 'Adepte';
  if(l>=6)  return 'Initié';
  if(l>=3)  return 'Apprenti';
  return 'Novice';
}
function addLog(stat,xp,title,date){
  state.log.push({date:date||dateKey(),stat:stat,xp:xp,title:title||''});
}

/* ================================================================
   QUÊTES
   ================================================================ */
function findQuest(id){
  for(var i=0;i<state.quests.length;i++){ if(state.quests[i].id===id) return state.quests[i]; }
  return null;
}
function dailyDoneOn(q,day){ return q.doneDates.indexOf(day)>=0; }

function toggleDaily(id,day){
  var q=findQuest(id); if(!q) return;
  var i=q.doneDates.indexOf(day);
  if(i>=0){
    q.doneDates.splice(i,1);
    addLog(q.stat,-q.xp,'Annulé : '+q.title,day);
  }else{
    q.doneDates.push(day);
    var pi=q.ar.indexOf(day);
    if(pi>=0){ q.ar.splice(pi,1); addLog(q.stat,PENALTY,'Pénalité annulée : '+q.title,day); }
    addLog(q.stat,q.xp,q.title,day);
    toast('+'+q.xp+' XP '+STATS[q.stat].label);
  }
  save(); renderAll();
}

function completeQuest(id){
  var q=findQuest(id); if(!q) return;
  q.done=true; q.archived=true; q.finishedOn=dateKey();
  addLog(q.stat,q.xp,q.title);
  toast('Quête terminée ! +'+q.xp+' XP');
  save(); renderAll();
}
function restoreQuest(id){
  var q=findQuest(id); if(!q) return;
  q.done=false; q.archived=false;
  addLog(q.stat,-q.xp,'Restaurée : '+q.title);
  save(); renderAll();
}
function deleteQuest(id){
  state.quests=state.quests.filter(function(q){ return q.id!==id; });
  save(); renderAll();
}

/* Pénalité : -5 XP par jour passé non coché, journalières seulement */
function applyPenalties(){
  var today=dateKey();
  var last=state.lastPenaltyCheck||today;
  if(last>=today){ state.lastPenaltyCheck=today; save(); return; }
  var day=last;
  var guard=0;
  while(day<today && guard<400){
    for(var i=0;i<state.quests.length;i++){
      var q=state.quests[i];
      if(q.type!=='journaliere') continue;
      if(q.created>day) continue;
      if(q.doneDates.indexOf(day)>=0) continue;
      if(q.ar.indexOf(day)>=0) continue;
      q.ar.push(day);
      var cur=totalXP(q.stat);
      var loss=Math.min(PENALTY,cur);
      if(loss>0) addLog(q.stat,-loss,'Pénalité : '+q.title,day);
    }
    day=addDays(day,1); guard++;
  }
  state.lastPenaltyCheck=today;
  save();
}

/* ================================================================
   MODALES
   ================================================================ */
function openModal(html){
  el('modal').innerHTML=html;
  el('ov').classList.add('on');
}
function closeModal(){
  el('ov').classList.remove('on');
  el('modal').innerHTML='';
}
el('ov').addEventListener('click',function(e){ if(e.target===el('ov')) closeModal(); });

function questForm(id,defType){
  var q=id?findQuest(id):null;
  var type=q?q.type:(defType&&TYPES[defType]?defType:'journaliere');
  var stat=q?q.stat:'sport';
  var typeOpts='',statOpts='';
  for(var t in TYPES){ typeOpts+='<option value="'+t+'"'+(t===type?' selected':'')+'>'+TYPES[t].label+'</option>'; }
  for(var s in STATS){ statOpts+='<option value="'+s+'"'+(s===stat?' selected':'')+'>'+STATS[s].label+'</option>'; }
  openModal(
    '<h2>'+(q?'Modifier la quête':'Nouvelle quête')+'</h2>'+
    '<label>Titre</label><input id="fTitle" value="'+esc(q?q.title:'')+'" placeholder="Ex : 30 pompes">'+
    '<label>Type</label><select id="fType">'+typeOpts+'</select>'+
    '<label>Centre d\'intérêt</label><select id="fStat">'+statOpts+'</select>'+
    '<label>XP donnée (libre)</label><input id="fXp" type="number" min="0" inputmode="numeric" value="'+(q?q.xp:10)+'">'+
    '<div class="small" id="fHint"></div>'+
    '<div class="row2"><button class="btn sec" id="fCancel">Annuler</button><button class="btn" id="fSave">Enregistrer</button></div>'+
    (q?'<div class="row2"><button class="btn bad" id="fDel">Supprimer</button></div>':'')
  );
  function hint(){
    el('fHint').textContent = el('fType').value==='journaliere'
      ? 'Journalière : −'+PENALTY+' XP si non cochée un jour passé.'
      : 'Sans pénalité. Archivée une fois terminée.';
  }
  hint();
  el('fType').onchange=hint;
  el('fCancel').onclick=closeModal;
  el('fSave').onclick=function(){
    var title=el('fTitle').value.trim();
    if(!title){ toast('Donne un titre'); return; }
    var xp=Math.max(0,parseInt(el('fXp').value,10)||0);
    if(q){
      q.title=title; q.type=el('fType').value; q.stat=el('fStat').value; q.xp=xp;
    }else{
      state.quests.push({
        id:uid(),title:title,type:el('fType').value,stat:el('fStat').value,xp:xp,
        done:false,archived:false,created:dateKey(),doneDates:[],ar:[]
      });
    }
    save(); closeModal(); renderAll(); toast('Enregistré ✓');
  };
  if(q) el('fDel').onclick=function(){ if(confirm('Supprimer cette quête ?')){ deleteQuest(q.id); closeModal(); } };
}

function slotForm(){
  openModal(
    '<h2>Nouveau créneau</h2>'+
    '<label>Jour</label><select id="sDay">'+
      [1,2,3,4,5,6,0].map(function(d){ return '<option value="'+d+'"'+(d===schedDay?' selected':'')+'>'+JOURS[d]+'</option>'; }).join('')+
    '</select>'+
    '<label>Début</label><input id="sStart" type="time" value="09:00">'+
    '<label>Fin</label><input id="sEnd" type="time" value="10:00">'+
    '<label>Activité</label><input id="sLabel" placeholder="Ex : Cours, Sport...">'+
    '<div class="row2"><button class="btn sec" id="sCancel">Annuler</button><button class="btn" id="sSave">Ajouter</button></div>'
  );
  el('sCancel').onclick=closeModal;
  el('sSave').onclick=function(){
    var label=el('sLabel').value.trim();
    if(!label){ toast('Donne un nom'); return; }
    var d=parseInt(el('sDay').value,10);
    state.schedule[d].push({id:uid(),start:el('sStart').value,end:el('sEnd').value,label:label});
    state.schedule[d].sort(function(a,b){ return a.start<b.start?-1:1; });
    save(); closeModal(); schedDay=d; renderAll(); toast('Ajouté ✓');
  };
}

function sleepForm(){
  openModal(
    '<h2>Sommeil</h2>'+
    '<label>Heure de coucher</label><input id="slBed" type="time" value="'+state.sleep.bed+'">'+
    '<label>Heure de réveil</label><input id="slWake" type="time" value="'+state.sleep.wake+'">'+
    '<div class="row2"><button class="btn sec" id="slCancel">Annuler</button><button class="btn" id="slSave">Enregistrer</button></div>'
  );
  el('slCancel').onclick=closeModal;
  el('slSave').onclick=function(){
    state.sleep={bed:el('slBed').value||'23:00',wake:el('slWake').value||'07:00'};
    save(); closeModal(); renderAll(); toast('Enregistré ✓');
  };
}

function nameForm(){
  openModal(
    '<h2>Nom du joueur</h2>'+
    '<label>Ton nom</label><input id="nName" value="'+esc(state.player)+'">'+
    '<div class="row2"><button class="btn sec" id="nCancel">Annuler</button><button class="btn" id="nSave">Enregistrer</button></div>'
  );
  el('nCancel').onclick=closeModal;
  el('nSave').onclick=function(){
    var n=el('nName').value.trim();
    if(!n){ toast('Nom vide'); return; }
    state.player=n; save(); closeModal(); renderAll(); toast('Nom changé ✓');
  };
  setTimeout(function(){ if(el('nName')) el('nName').focus(); },100);
}

/* ---------- EXPORT / IMPORT ---------- */
function exportData(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='jeu-de-la-vie-'+dateKey()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  toast('Export lancé ✓');
}
function importData(file){
  if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      state=normalize(JSON.parse(r.result));
      state.lastPenaltyCheck=dateKey();
      save(); closeModal(); renderAll(); toast('Import réussi ✓');
    }catch(e){ toast('Fichier invalide'); }
  };
  r.readAsText(file);
  el('fileIn').value='';
}

function openSettings(){
  openModal(
    '<h2>Réglages</h2>'+
    '<label>Nom du joueur</label>'+
    '<div class="row2" style="margin-top:0"><input id="rName" value="'+esc(state.player)+'"><button class="btn" id="rNameSave" style="flex:none;width:auto">OK</button></div>'+
    '<label style="margin-top:18px">Données</label>'+
    '<div class="row2" style="margin-top:0"><button class="btn sec" id="rExport">Exporter</button><button class="btn sec" id="rImport">Importer</button></div>'+
    '<div class="row2"><button class="btn bad" id="rReset">Tout réinitialiser</button></div>'+
    '<div class="row2"><button class="btn sec" id="rClose">Fermer</button></div>'
  );
  el('rNameSave').onclick=function(){
    var n=el('rName').value.trim();
    if(!n){ toast('Nom vide'); return; }
    state.player=n; save(); renderAll(); toast('Nom changé ✓');
  };
  el('rExport').onclick=exportData;
  el('rImport').onclick=function(){ el('fileIn').click(); };
  el('rReset').onclick=function(){
    if(confirm('Tout effacer ? Fais un export avant !')){
      state=defaultState(); save(); closeModal(); renderAll(); toast('Réinitialisé');
    }
  };
  el('rClose').onclick=closeModal;
}
el('fileIn').addEventListener('change',function(){ if(this.files&&this.files[0]) importData(this.files[0]); });

/* ================================================================
   AFFICHAGE
   ================================================================ */
var currentView='today';
var viewDay=dateKey();
var questFilter='commune';
var statRange=7;
var schedDay=new Date().getDay();

function renderHeader(){
  el('hName').textContent=state.player;
  el('headDate').textContent=dateFr(new Date());
}

function renderToday(){
  var today=dateKey();
  var d=parseKey(viewDay);
  var isToday=(viewDay===today);
  el('todayTitle').textContent=isToday?"Aujourd'hui":(JOURS[d.getDay()].charAt(0).toUpperCase()+JOURS[d.getDay()].slice(1)+' '+d.getDate()+' '+MOIS[d.getMonth()].slice(0,4)+'.');
  el('dayNext').style.visibility=viewDay>=today?'hidden':'visible';

  var quests=state.quests.filter(function(q){ return q.type==='journaliere' && q.created<=viewDay; });
  var html='',done=0;
  for(var i=0;i<quests.length;i++){
    var q=quests[i];
    var ok=dailyDoneOn(q,viewDay);
    var missed=!ok && q.ar.indexOf(viewDay)>=0;
    if(ok) done++;
    html+='<div class="q'+(ok?' done':'')+'">'+
      '<button class="chk" data-chk="'+q.id+'">✓</button>'+
      '<div class="qb"><div class="qt">'+esc(q.title)+'</div>'+
      '<div class="qm">'+dot(q.stat)+STATS[q.stat].label+(missed?' · <span style="color:var(--bad)">−'+PENALTY+' XP</span>':'')+'</div></div>'+
      '<div class="xp">+'+q.xp+'</div>'+
      '<button class="more" data-edit="'+q.id+'">⋯</button></div>';
  }
  el('dailyList').innerHTML=html||'<div class="empty">Aucune quête journalière.<br>Appuie sur ＋ pour en créer une.</div>';
  el('dayProgress').textContent=done+' / '+quests.length+' accomplies';
  el('dayBar').style.width=(quests.length?Math.round(done/quests.length*100):0)+'%';

  var slots=state.schedule[d.getDay()]||[];
  var sh='';
  for(var j=0;j<slots.length;j++){
    sh+='<div class="slot"><div class="h">'+slots[j].start+' – '+slots[j].end+'</div><div class="l">'+esc(slots[j].label)+'</div></div>';
  }
  el('todaySchedule').innerHTML=sh||'<div class="empty">Rien de prévu ce jour.</div>';
}

function renderQuests(){
  var btns=el('questSeg').querySelectorAll('button');
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle('on',btns[b].getAttribute('data-f')===questFilter); }
  var list=state.quests.filter(function(q){
    if(questFilter==='archives') return q.type!=='journaliere' && q.archived;
    return q.type===questFilter && !q.archived;
  });
  var html='';
  for(var i=0;i<list.length;i++){
    var q=list[i];
    var arch=questFilter==='archives';
    html+='<div class="q'+(arch?' done':'')+'">'+
      (arch?'<button class="chk" data-restore="'+q.id+'" title="Restaurer">↺</button>'
           :'<button class="chk" data-complete="'+q.id+'">✓</button>')+
      '<div class="qb"><div class="qt">'+esc(q.title)+'</div>'+
      '<div class="qm">'+tag(q)+dot(q.stat)+STATS[q.stat].label+(arch&&q.finishedOn?' · '+q.finishedOn:'')+'</div></div>'+
      '<div class="xp">+'+q.xp+'</div>'+
      '<button class="more" data-edit="'+q.id+'">⋯</button></div>';
  }
  el('questList').innerHTML=html||'<div class="empty">'+(questFilter==='archives'?'Aucune quête archivée.':'Aucune quête ici.<br>Appuie sur ＋ pour en créer une.')+'</div>';
}

function renderProfile(){
  var all=0;
  for(var i=0;i<STAT_KEYS.length;i++) all+=totalXP(STAT_KEYS[i]);
  var ov=levelFromXP(all);
  var html='<div class="card"><div class="pname"><h2>'+esc(state.player)+'</h2>'+
    '<button class="ibtn" id="btnRename" title="Changer le nom">✎</button></div>'+
    '<div class="lvbig"><div class="n">'+ov.level+'</div><div class="t">Overall · '+titleForLevel(ov.level)+'</div></div>'+
    '<div class="bar"><div style="width:'+Math.round(ov.into/ov.need*100)+'%"></div></div>'+
    '<div class="small" style="text-align:center">'+ov.into+' / '+ov.need+' XP · total '+all+'</div></div>';
  html+='<div class="card"><h3>Centres d\'intérêt</h3>';
  for(var k=0;k<STAT_KEYS.length;k++){
    var key=STAT_KEYS[k];
    var xp=totalXP(key);
    var lv=levelFromXP(xp);
    html+='<div class="stat"><div class="row"><div class="nm">'+dot(key)+STATS[key].label+'</div>'+
      '<div class="lv">Niv. '+lv.level+' · '+titleForLevel(lv.level)+'</div></div>'+
      '<div class="bar"><div style="width:'+Math.round(lv.into/lv.need*100)+'%;background:'+STATS[key].color+'"></div></div>'+
      '<div class="small">'+lv.into+' / '+lv.need+' XP</div></div>';
  }
  html+='</div>';
  el('profileBox').innerHTML=html;
  el('btnRename').onclick=nameForm;
}

function renderStats(){
  var btns=el('rangeSeg').querySelectorAll('button');
  for(var b=0;b<btns.length;b++){ btns[b].classList.toggle('on',parseInt(btns[b].getAttribute('data-r'),10)===statRange); }
  drawChart();
  var from=addDays(dateKey(),-(statRange-1));
  var per={},total=0,i;
  for(i=0;i<STAT_KEYS.length;i++) per[STAT_KEYS[i]]=0;
  for(i=0;i<state.log.length;i++){
    var l=state.log[i];
    if(l.date>=from && l.xp>0){ per[l.stat]+=l.xp; total+=l.xp; }
  }
  var html='<div style="font-size:26px;font-weight:800;margin-bottom:10px">'+total+' <span style="font-size:13px;color:var(--mut);font-weight:400">XP sur la période</span></div>';
  for(i=0;i<STAT_KEYS.length;i++){
    html+='<div class="slot"><div class="l">'+dot(STAT_KEYS[i])+' '+STATS[STAT_KEYS[i]].label+'</div><div class="xp">'+per[STAT_KEYS[i]]+' XP</div></div>';
  }
  el('statsSummary').innerHTML=html;
}

function drawChart(){
  var cv=el('chart');
  if(!cv||!cv.offsetWidth) return;
  var dpr=window.devicePixelRatio||1;
  var W=cv.offsetWidth,H=220;
  cv.width=W*dpr; cv.height=H*dpr;
  var c=cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);

  var n=statRange;
  var step=n<=7?1:(n<=30?1:(n<=90?3:7));
  var buckets=[];
  var today=dateKey();
  var start=addDays(today,-(n-1));
  var cur=start;
  while(cur<=today){
    var end=addDays(cur,step-1); if(end>today) end=today;
    var b={from:cur,to:end,v:{}};
    for(var k=0;k<STAT_KEYS.length;k++) b.v[STAT_KEYS[k]]=0;
    buckets.push(b);
    cur=addDays(end,1);
  }
  for(var i=0;i<state.log.length;i++){
    var l=state.log[i];
    if(l.xp<=0) continue;
    for(var j=0;j<buckets.length;j++){
      if(l.date>=buckets[j].from && l.date<=buckets[j].to){ buckets[j].v[l.stat]+=l.xp; break; }
    }
  }
  var max=10;
  for(var m=0;m<buckets.length;m++){
    var s=0; for(var q=0;q<STAT_KEYS.length;q++) s+=buckets[m].v[STAT_KEYS[q]];
    if(s>max) max=s;
  }
  var padL=30,padB=22,padT=8,padR=6;
  var cw=W-padL-padR,ch=H-padB-padT;
  c.strokeStyle='#2c3252'; c.fillStyle='#8a90b4'; c.font='10px sans-serif'; c.lineWidth=1;
  for(var g=0;g<=4;g++){
    var gy=padT+ch-(g/4)*ch;
    c.beginPath(); c.moveTo(padL,gy); c.lineTo(W-padR,gy); c.stroke();
    c.fillText(Math.round(max*g/4),2,gy+3);
  }
  var bw=cw/buckets.length;
  var barW=Math.max(2,bw*0.7);
  for(var x=0;x<buckets.length;x++){
    var bx=padL+x*bw+(bw-barW)/2;
    var yy=padT+ch;
    for(var t=0;t<STAT_KEYS.length;t++){
      var val=buckets[x].v[STAT_KEYS[t]];
      if(!val) continue;
      var h=(val/max)*ch;
      yy-=h;
      c.fillStyle=STATS[STAT_KEYS[t]].hex;
      c.fillRect(bx,yy,barW,h);
    }
    var showLabel = buckets.length<=10 || x%Math.ceil(buckets.length/6)===0;
    if(showLabel){
      var dd=parseKey(buckets[x].from);
      c.fillStyle='#8a90b4'; c.textAlign='center';
      c.fillText(dd.getDate()+'/'+(dd.getMonth()+1),bx+barW/2,H-6);
      c.textAlign='left';
    }
  }
  var lg='';
  for(var z=0;z<STAT_KEYS.length;z++) lg+='<span>'+dot(STAT_KEYS[z])+STATS[STAT_KEYS[z]].label+'</span>';
  el('chartLegend').innerHTML=lg;
}

function renderPlan(){
  var order=[1,2,3,4,5,6,0];
  var dh='';
  for(var i=0;i<order.length;i++){
    dh+='<button data-d="'+order[i]+'"'+(order[i]===schedDay?' class="on"':'')+'>'+JOURS_C[order[i]]+'</button>';
  }
  el('schedDays').innerHTML=dh;
  var slots=state.schedule[schedDay]||[];
  var html='';
  for(var j=0;j<slots.length;j++){
    html+='<div class="slot"><div class="h">'+slots[j].start+' – '+slots[j].end+'</div><div class="l">'+esc(slots[j].label)+'</div>'+
      '<button class="x" data-slotdel="'+slots[j].id+'">✕</button></div>';
  }
  el('schedList').innerHTML=html||'<div class="empty">Aucun créneau ce jour.</div>';

  var bed=state.sleep.bed,wake=state.sleep.wake;
    var bm=parseInt(bed.split(':')[0],10)*60+parseInt(bed.split(':')[1],10);
  var wm=parseInt(wake.split(':')[0],10)*60+parseInt(wake.split(':')[1],10);
  var dur=wm-bm; if(dur<=0) dur+=1440;
  var hh=Math.floor(dur/60),mm=dur%60;
  el('sleepBox').innerHTML=
    '<div class="slot"><div class="h">Coucher</div><div class="l">'+bed+'</div></div>'+
    '<div class="slot"><div class="h">Réveil</div><div class="l">'+wake+'</div></div>'+
    '<div class="slot"><div class="h">Durée</div><div class="l">'+hh+' h '+pad2(mm)+'</div></div>'+
    '<div class="row2"><button class="btn sec" id="btnSleep">Modifier le sommeil</button></div>';
  el('btnSleep').onclick=sleepForm;
}

function renderAll(){
  renderHeader();
  renderToday();
  renderQuests();
  renderProfile();
  renderStats();
  renderPlan();
}

function showView(v){
  currentView=v;
  var views=document.querySelectorAll('.view');
  for(var i=0;i<views.length;i++){ views[i].classList.toggle('on',views[i].id==='v-'+v); }
  var nb=el('nav').querySelectorAll('button');
  for(var j=0;j<nb.length;j++){ nb[j].classList.toggle('on',nb[j].getAttribute('data-v')===v); }
  window.scrollTo(0,0);
  if(v==='stats') setTimeout(drawChart,30);
}

/* ================================================================
   ÉVÉNEMENTS
   ================================================================ */
el('nav').addEventListener('click',function(e){
  var b=e.target.closest('button[data-v]');
  if(b) showView(b.getAttribute('data-v'));
});

el('dayPrev').onclick=function(){ viewDay=addDays(viewDay,-1); renderToday(); };
el('dayNext').onclick=function(){
  if(viewDay<dateKey()){ viewDay=addDays(viewDay,1); renderToday(); }
};

/* Clics dans la liste du jour */
el('dailyList').addEventListener('click',function(e){
  var c=e.target.closest('[data-chk]');
  if(c){ toggleDaily(c.getAttribute('data-chk'),viewDay); return; }
  var m=e.target.closest('[data-edit]');
  if(m){ questForm(m.getAttribute('data-edit')); }
});

/* Clics dans la liste des quêtes */
el('questList').addEventListener('click',function(e){
  var c=e.target.closest('[data-complete]');
  if(c){ completeQuest(c.getAttribute('data-complete')); return; }
  var r=e.target.closest('[data-restore]');
  if(r){ restoreQuest(r.getAttribute('data-restore')); return; }
  var m=e.target.closest('[data-edit]');
  if(m){ questForm(m.getAttribute('data-edit')); }
});

/* Filtres des quêtes (4 onglets) */
el('questSeg').addEventListener('click',function(e){
  var b=e.target.closest('button[data-f]');
  if(!b) return;
  questFilter=b.getAttribute('data-f');
  renderQuests();
});

/* Période des stats (semaine, mois...) */
el('rangeSeg').addEventListener('click',function(e){
  var b=e.target.closest('button[data-r]');
  if(!b) return;
  statRange=parseInt(b.getAttribute('data-r'),10);
  renderStats();
});

/* Planning : jours + suppression de créneau */
el('schedDays').addEventListener('click',function(e){
  var b=e.target.closest('button[data-d]');
  if(!b) return;
  schedDay=parseInt(b.getAttribute('data-d'),10);
  renderPlan();
});
el('schedList').addEventListener('click',function(e){
  var x=e.target.closest('[data-slotdel]');
  if(!x) return;
  var id=x.getAttribute('data-slotdel');
  state.schedule[schedDay]=state.schedule[schedDay].filter(function(s){ return s.id!==id; });
  save(); renderPlan(); renderToday();
});
el('btnAddSlot').onclick=slotForm;

/* Boutons du haut */
el('btnAdd').onclick=function(){
  var t=(currentView==='quests' && questFilter!=='archives')?questFilter:'journaliere';
  questForm(null,t);
};
el('btnSettings').onclick=openSettings;

window.addEventListener('resize',function(){ if(currentView==='stats') drawChart(); });

/* ================================================================
   DÉMARRAGE
   ================================================================ */
load();
applyPenalties();
renderAll();

/* Si l'appli reste ouverte au passage de minuit */
setInterval(function(){
  var today=dateKey();
  if(state.lastPenaltyCheck!==today){
    if(viewDay===state.lastPenaltyCheck) viewDay=today;
    applyPenalties();
    renderAll();
  }
},60000);
</script>
