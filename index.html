<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Jeu de la Vie</title>
<style>
/* ============ VARIABLES ============ */
:root{
  --bg:#000;
  --bg2:#0b0b0d;
  --card:#1c1c1e;
  --card2:#2c2c2e;
  --line:#38383a;
  --text:#f5f5f7;
  --muted:#8e8e93;
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#bf5af2;
  --yellow:#ffd60a;
  --radius:18px;
  --c-sport:#ff453a;
  --c-meditation:#bf5af2;
  --c-philosophie:#ffd60a;
  --c-electronique:#0a84ff;
  --c-overall:#30d158;
}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:90px;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select,textarea{font-family:inherit;color:var(--text)}

/* ============ LAYOUT ============ */
.app{max-width:720px;margin:0 auto;padding:20px 16px}
header.top{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:18px;
}
header.top h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
header.top .date{color:var(--muted);font-size:14px;margin-top:2px}
.icon-btn{
  background:var(--card);width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}

/* ============ NAVIGATION (barre du bas) ============ */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(28,28,30,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:50;
}
nav.tabs button{
  background:none;flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:10px;color:var(--muted);padding:4px 0;
}
nav.tabs button .ico{font-size:21px}
nav.tabs button.active{color:var(--blue)}

/* ============ VUES ============ */
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ CARTES ============ */
.card{
  background:var(--card);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.card h2{font-size:17px;font-weight:600;margin-bottom:12px}
.card h3{font-size:13px;color:var(--muted);font-weight:500;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}

/* ============ PROFIL ============ */
.profile{
  display:flex;align-items:center;gap:14px;
}
.avatar{
  width:62px;height:62px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:30px;
  flex-shrink:0;
}
.profile .info{flex:1;min-width:0}
.profile .name{font-size:19px;font-weight:700}
.profile .title{color:var(--yellow);font-size:14px;font-weight:600;margin-top:2px}

/* ============ BARRES DE PROGRESSION ============ */
.bar{
  height:8px;background:var(--card2);border-radius:99px;overflow:hidden;
}
.bar > i{
  display:block;height:100%;width:0;border-radius:99px;
  background:var(--blue);transition:width .5s cubic-bezier(.2,.8,.2,1);
}

/* ============ CENTRES D'INTÉRÊT ============ */
.stat{margin-bottom:14px}
.stat:last-child{margin-bottom:0}
.stat .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stat .lbl{font-weight:600;font-size:15px}
.stat .lvl{font-size:13px;color:var(--muted)}
.stat .ttl{font-size:12px;margin-top:4px;color:var(--muted)}

/* ============ QUÊTES ============ */
.quest{
  display:flex;align-items:center;gap:12px;
  background:var(--card2);border-radius:14px;
  padding:12px 14px;margin-bottom:8px;
}
.quest:last-child{margin-bottom:0}
.check{
  width:26px;height:26px;border-radius:50%;
  border:2px solid var(--muted);background:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:transparent;transition:all .2s;
}
.quest.done .check{background:var(--green);border-color:var(--green);color:#000}
.quest.done .q-name{text-decoration:line-through;color:var(--muted)}
.q-body{flex:1;min-width:0}
.q-name{font-size:15px;font-weight:500}
.q-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.badge{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:rgba(255,255,255,.08);color:var(--muted);
}
.badge.t-journaliere{background:rgba(10,132,255,.18);color:var(--blue)}
.badge.t-commune{background:rgba(48,209,88,.18);color:var(--green)}
.badge.t-epique{background:rgba(191,90,242,.18);color:var(--purple)}
.badge.t-legendaire{background:rgba(255,159,10,.2);color:var(--orange)}
.badge.xp{background:rgba(255,214,10,.15);color:var(--yellow)}
.q-actions{display:flex;gap:6px}
.mini{
  background:none;color:var(--muted);font-size:16px;
  width:30px;height:30px;border-radius:8px;
}
.mini:active{background:var(--card)}

/* ============ ONGLETS INTERNES ============ */
.seg{
  display:flex;background:var(--card);border-radius:12px;
  padding:3px;margin-bottom:14px;
}
.seg button{
  flex:1;background:none;padding:8px 4px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--muted);
}
.seg button.active{background:var(--card2);color:var(--text)}

/* ============ BOUTONS ============ */
.btn{
  background:var(--blue);color:#fff;font-weight:600;font-size:15px;
  padding:13px 18px;border-radius:14px;width:100%;
}
.btn:active{opacity:.8}
.btn.secondary{background:var(--card2);color:var(--text)}
.btn.danger{background:rgba(255,69,58,.15);color:var(--red)}
.btn.small-btn{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:8px}

/* ============ FORMULAIRES ============ */
label.field{display:block;margin-bottom:14px}
label.field > span{
  display:block;font-size:12px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;
}
input[type=text],input[type=number],input[type=time],select,textarea{
  width:100%;background:var(--card2);border:1px solid transparent;
  border-radius:12px;padding:12px 14px;font-size:16px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  background:var(--card2);padding:8px 14px;border-radius:99px;
  font-size:14px;font-weight:500;border:1px solid transparent;
}
.chip.on{border-color:var(--blue);background:rgba(10,132,255,.15);color:var(--blue)}

/* ============ MODALE ============ */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--card);width:100%;max-width:720px;
  border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;
  animation:up .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.modal h2{font-size:20px;margin-bottom:16px}

/* ============ GRAPHIQUES ============ */
.chart{width:100%;height:170px;display:block}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.chart-legend span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.chart-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ============ EMPLOI DU TEMPS ============ */
.slot{
  display:flex;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.slot:last-child{border-bottom:none}
.slot .time{width:84px;font-size:13px;color:var(--muted);flex-shrink:0}
.slot .what{flex:1;font-size:15px}

/* ============ TOAST ============ */
.toast{
  position:fixed;top:18px;left:50%;transform:translate(-50%,-120px);
  background:var(--card2);color:var(--text);padding:12px 20px;
  border-radius:99px;font-size:14px;font-weight:500;z-index:200;
  box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1);
  max-width:90%;text-align:center;
}
.toast.show{transform:translate(-50%,0)}

/* ============ DIVERS ============ */
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.nav-day{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav-day button{
  background:var(--card);width:36px;height:36px;border-radius:50%;font-size:16px;
}
.nav-day .label{font-weight:600;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card2);border-radius:14px;padding:14px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
.history-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;
}
.history-item:last-child{border-bottom:none}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>

<body>
<div class="app">

  <!-- ============ EN-TÊTE ============ -->
  <header class="top">
    <div>
      <h1>Jeu de la Vie</h1>
      <div class="date" id="todayLabel"></div>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="Réglages">⚙</button>
  </header>

  <!-- ============ VUE : AUJOURD'HUI ============ -->
  <section class="view active" id="view-today">

    <div class="card">
      <div class="profile">
        <div class="avatar">⚔</div>
        <div class="info">
          <div class="name" id="playerName">Joueur</div>
          <div class="title" id="playerTitle"></div>
          <div class="bar" style="margin-top:8px"><i id="overallBar" style="background:var(--c-overall)"></i></div>
          <div class="small muted" style="margin-top:5px" id="overallText"></div>
        </div>
      </div>
    </div>

    <div class="nav-day">
      <button id="dayPrev">‹</button>
      <div class="label" id="dayLabel"></div>
      <button id="dayNext">›</button>
    </div>

    <div class="card">
      <div class="row between" style="margin-bottom:12px">
        <h2 style="margin:0">Quêtes journalières</h2>
        <span class="small muted" id="dailyCount"></span>
      </div>
      <div id="dailyList"></div>
      <div class="small muted center" style="margin-top:12px" id="penaltyNote"></div>
    </div>

    <div class="card">
      <h3>Emploi du temps du jour</h3>
      <div id="todaySchedule"></div>
    </div>

    <button class="btn" id="btnAddQuestToday">+ Nouvelle quête</button>
  </section>

  <!-- ============ VUE : QUÊTES (commune / épique / légendaire) ============ -->
  <section class="view" id="view-quests">
    <div class="seg" id="questSeg">
      <button data-f="actives" class="active">Actives</button>
      <button data-f="commune">Communes</button>
      <button data-f="epique">Épiques</button>
      <button data-f="legendaire">Légendaires</button>
      <button data-f="archive">Archives</button>
    </div>
    <div id="questList"></div>
    <button class="btn" id="btnAddQuest" style="margin-top:6px">+ Nouvelle quête</button>
  </section>

  <!-- ============ VUE : PROFIL / CENTRES D'INTÉRÊT ============ -->
  <section class="view" id="view-profile">
    <div class="card">
      <h2>Niveaux</h2>
      <div id="statsList"></div>
    </div>
    <div class="card">
      <h2>Titres</h2>
      <div id="titlesList"></div>
    </div>
  </section>

  <!-- ============ VUE : STATS / GRAPHIQUES ============ -->
  <section class="view" id="view-stats">
    <div class="seg" id="statSeg">
      <button data-r="day" class="active">Jour</button>
      <button data-r="week">Semaine</button>
      <button data-r="month">Mois</button>
    </div>
    <div class="grid2" style="margin-bottom:14px" id="kpis"></div>
    <div class="card">
      <h3 id="chartTitle">XP gagnée</h3>
      <canvas class="chart" id="chart"></canvas>
      <div class="chart-legend" id="chartLegend"></div>
    </div>
    <div class="card">
      <h3>Historique récent</h3>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ============ VUE : EMPLOI DU TEMPS ============ -->
  <section class="view" id="view-schedule">
    <div class="seg" id="schedSeg">
      <button data-d="1" class="active">Lun</button>
      <button data-d="2">Mar</button>
      <button data-d="3">Mer</button>
      <button data-d="4">Jeu</button>
      <button data-d="5">Ven</button>
      <button data-d="6">Sam</button>
      <button data-d="0">Dim</button>
    </div>
    <div class="card">
      <div id="schedList"></div>
    </div>
    <button class="btn" id="btnAddSlot">+ Ajouter un créneau</button>
  </section>

</div>

<!-- ============ BARRE DE NAVIGATION ============ -->
<nav class="tabs" id="tabs">
  <button data-v="today" class="active"><span class="ico">☀</span>Aujourd'hui</button>
  <button data-v="quests"><span class="ico">⚔</span>Quêtes</button>
  <button data-v="profile"><span class="ico">★</span>Profil</button>
  <button data-v="stats"><span class="ico">▤</span>Stats</button>
  <button data-v="schedule"><span class="ico">◷</span>Planning</button>
</nav>

<!-- ============ MODALE (contenu injecté par JS) ============ -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   PARTIE 2 : DONNÉES, QUÊTES, XP, PÉNALITÉS
   ================================================================ */

/* ---------- CONSTANTES ---------- */
var STORE_KEY = 'jdv_data_v2';
var OLD_KEYS = ['jdv_data', 'jeudelavie', 'jdv', 'gameOfLife', 'lifeGame', 'jdv_data_v1'];
var PENALTY = 5;

var TYPES = {
  journaliere: { label: 'Journalière', css: 't-journaliere' },
  commune:     { label: 'Commune',     css: 't-commune' },
  epique:      { label: 'Épique',      css: 't-epique' },
  legendaire:  { label: 'Légendaire',  css: 't-legendaire' }
};

var STATS = {
  sport:        { label: 'Sport',        color: 'var(--c-sport)' },
  meditation:   { label: 'Méditation',   color: 'var(--c-meditation)' },
  philosophie:  { label: 'Philosophie',  color: 'var(--c-philosophie)' },
  electronique: { label: 'Électronique', color: 'var(--c-electronique)' }
};

/* ---------- OUTILS ---------- */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function pad2(n) {
  return n < 10 ? '0' + n : '' + n;
}

function dateKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function parseKey(k) {
  var p = k.split('-');
  return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
}

function addDays(k, n) {
  var d = parseKey(k);
  d.setDate(d.getDate() + n);
  return dateKey(d);
}

function esc(s) {
  var div = document.createElement('div');
  div.textContent = (s === undefined || s === null) ? '' : String(s);
  return div.innerHTML;
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove('show'); }, 2400);
}

/* ---------- ÉTAT ---------- */
var state = null;

function defaultState() {
  return {
    version: 2,
    player: { name: 'Joueur' },
    quests: [],        // {id,name,type,stat,xp,created,archived,doneOn,recurDays}
    completions: {},   // dateKey -> [questId, ...] (journalières)
    log: [],           // {id,ts,date,kind,questId,name,stat,xp}
    lastPenaltyCheck: dateKey(),
    schedule: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] }
  };
}

/* ---------- SAUVEGARDE ---------- */
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('Erreur de sauvegarde');
  }
}

function load() {
  var raw = localStorage.getItem(STORE_KEY);
  if (raw) {
    try {
      state = JSON.parse(raw);
      repairState();
      return;
    } catch (e) { /* on tente la suite */ }
  }
  /* Pas de données v2 : on cherche une ancienne version */
  for (var i = 0; i < OLD_KEYS.length; i++) {
    var old = localStorage.getItem(OLD_KEYS[i]);
    if (old) {
      try {
        var parsed = JSON.parse(old);
        state = migrate(parsed);
        save();
        setTimeout(function () { toast('Anciennes données converties ✓'); }, 600);
        return;
      } catch (e2) { /* clé suivante */ }
    }
  }
  state = defaultState();
  save();
}

function repairState() {
  var d = defaultState();
  for (var k in d) {
    if (state[k] === undefined) state[k] = d[k];
  }
  if (!state.player) state.player = { name: 'Joueur' };
  for (var i = 0; i < 7; i++) {
    if (!state.schedule[i]) state.schedule[i] = [];
  }
}

/* ---------- CONVERSION DES ANCIENNES DONNÉES ----------
   facile -> commune | dure -> epique | difficile -> legendaire
   On garde le plus possible : nom, XP, centre d'intérêt, historique.
------------------------------------------------------------------ */
function convertOldType(t) {
  t = String(t || '').toLowerCase();
  if (t.indexOf('diff') === 0) return 'legendaire';
  if (t.indexOf('dur') === 0) return 'epique';
  if (t.indexOf('fac') === 0) return 'commune';
  if (TYPES[t]) return t;
  return 'commune';
}

function convertOldStat(s) {
  s = String(s || '').toLowerCase();
  s = s.replace(/é|è|ê/g, 'e');
  if (STATS[s]) return s;
  if (s.indexOf('spor') === 0) return 'sport';
  if (s.indexOf('med') === 0) return 'meditation';
  if (s.indexOf('phil') === 0) return 'philosophie';
  if (s.indexOf('elec') === 0) return 'electronique';
  return 'sport';
}

function migrate(old) {
  var s = defaultState();
  if (!old || typeof old !== 'object') return s;

  /* Format déjà v2 */
  if (old.version === 2) {
    state = old;
    repairState();
    return state;
  }

  if (old.player && old.player.name) s.player.name = old.player.name;
  else if (old.name) s.player.name = old.name;
  else if (old.pseudo) s.player.name = old.pseudo;

  var oldQuests = old.quests || old.quetes || [];
  for (var i = 0; i < oldQuests.length; i++) {
    var q = oldQuests[i] || {};
    s.quests.push({
      id: q.id || uid(),
      name: q.name || q.nom || q.title || 'Quête',
      type: convertOldType(q.difficulty || q.difficulte || q.type),
      stat: convertOldStat(q.stat || q.category || q.categorie || q.interest),
      xp: parseInt(q.xp, 10) || 10,
      created: q.created || dateKey(),
      archived: !!(q.archived || q.done || q.completed),
      doneOn: q.doneOn || q.completedOn || null
    });
  }

  var oldLog = old.log || old.history || old.historique || [];
  for (var j = 0; j < oldLog.length; j++) {
    var l = oldLog[j] || {};
    s.log.push({
      id: l.id || uid(),
      ts: l.ts || l.time || Date.now(),
      date: l.date || dateKey(),
      kind: l.kind || (l.xp < 0 ? 'penalty' : 'quest'),
      questId: l.questId || null,
      name: l.name || l.nom || '',
      stat: convertOldStat(l.stat || l.category),
      xp: parseInt(l.xp, 10) || 0
    });
  }

  /* Si l'ancienne appli stockait directement l'XP par stat sans historique */
  var oldStats = old.stats || old.xp;
  if (oldStats && typeof oldStats === 'object' && !s.log.length) {
    for (var key in oldStats) {
      var val = oldStats[key];
      var amount = (typeof val === 'object') ? (parseInt(val.xp, 10) || 0) : (parseInt(val, 10) || 0);
      if (amount > 0) {
        s.log.push({
          id: uid(), ts: Date.now(), date: dateKey(), kind: 'import',
          questId: null, name: 'XP importée', stat: convertOldStat(key), xp: amount
        });
      }
    }
  }

  return s;
}

/* ---------- EXPORT / IMPORT ---------- */
function exportData() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jeu-de-la-vie-' + dateKey() + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 500);
  toast('Export terminé ✓');
}

function importData(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(reader.result);
      var converted = migrate(parsed);
      if (converted === state) { /* déjà v2, migrate a remplacé state */ }
      else state = converted;
      repairState();
      save();
      closeModal();
      renderAll();
      toast('Import réussi ✓');
    } catch (e) {
      toast('Fichier invalide');
    }
  };
  reader.readAsText(file);
}

/* ---------- XP ---------- */
function totalXP(stat) {
  var sum = 0;
  for (var i = 0; i < state.log.length; i++) {
    var l = state.log[i];
    if (!stat || l.stat === stat) sum += (l.xp || 0);
  }
  return Math.max(0, sum);
}

function addLog(kind, quest, xp) {
  state.log.push({
    id: uid(),
    ts: Date.now(),
    date: dateKey(),
    kind: kind,
    questId: quest ? quest.id : null,
    name: quest ? quest.name : '',
    stat: quest ? quest.stat : 'sport',
    xp: xp
  });
}

/* ---------- QUÊTES : ACCÈS ---------- */
function getQuest(id) {
  for (var i = 0; i < state.quests.length; i++) {
    if (state.quests[i].id === id) return state.quests[i];
  }
  return null;
}

function dailyQuests() {
  return state.quests.filter(function (q) {
    return q.type === 'journaliere' && !q.archived;
  });
}

function isDailyDone(questId, key) {
  var arr = state.completions[key] || [];
  return arr.indexOf(questId) !== -1;
}

/* ---------- QUÊTES : ACTIONS ---------- */
function createQuest(data) {
  var q = {
    id: uid(),
    name: data.name,
    type: data.type,
    stat: data.stat,
    xp: Math.max(0, parseInt(data.xp, 10) || 0),
    created: dateKey(),
    archived: false,
    doneOn: null
  };
  state.quests.push(q);
  save();
  return q;
}

function updateQuest(id, data) {
  var q = getQuest(id);
  if (!q) return;
  q.name = data.name;
  q.type = data.type;
  q.stat = data.stat;
  q.xp = Math.max(0, parseInt(data.xp, 10) || 0);
  save();
}

function deleteQuest(id) {
  state.quests = state.quests.filter(function (q) { return q.id !== id; });
  save();
}

/* Cocher / décocher une journalière pour un jour donné */
function toggleDaily(questId, key) {
  var q = getQuest(questId);
  if (!q) return;
  if (!state.completions[key]) state.completions[key] = [];
  var arr = state.completions[key];
  var idx = arr.indexOf(questId);

  if (idx === -1) {
    arr.push(questId);
    state.log.push({
      id: uid(), ts: Date.now(), date: key, kind: 'daily',
      questId: q.id, name: q.name, stat: q.stat, xp: q.xp
    });
    toast('+' + q.xp + ' XP · ' + STATS[q.stat].label);
  } else {
    arr.splice(idx, 1);
    state.log = state.log.filter(function (l) {
      return !(l.kind === 'daily' && l.questId === questId && l.date === key);
    });
    toast('Quête décochée');
  }
  save();
}

/* Terminer une quête commune / épique / légendaire -> archivée */
function completeQuest(id) {
  var q = getQuest(id);
  if (!q || q.archived) return;
  q.archived = true;
  q.doneOn = dateKey();
  state.log.push({
    id: uid(), ts: Date.now(), date: dateKey(), kind: 'quest',
    questId: q.id, name: q.name, stat: q.stat, xp: q.xp
  });
  save();
  toast('+' + q.xp + ' XP · ' + STATS[q.stat].label);
}

/* Restaurer une quête archivée (retire l'XP gagnée) */
function restoreQuest(id) {
  var q = getQuest(id);
  if (!q) return;
  q.archived = false;
  q.doneOn = null;
  state.log = state.log.filter(function (l) {
    return !(l.kind === 'quest' && l.questId === id);
  });
  save();
  toast('Quête restaurée');
}

/* ---------- PÉNALITÉ -5 XP (journalières uniquement) ----------
   Appliquée pour chaque jour PASSÉ (jamais aujourd'hui) où une
   journalière existante n'a pas été cochée.
------------------------------------------------------------------ */
function applyPenalties() {
  var today = dateKey();
  var from = state.lastPenaltyCheck || today;
  if (from >= today) return;

  var cursor = from;
  var applied = 0;
  var guard = 0;

  while (cursor < today && guard < 400) {
    var quests = state.quests.filter(function (q) {
      return q.type === 'journaliere' && q.created <= cursor && !q.archived;
    });
    for (var i = 0; i < quests.length; i++) {
      var q = quests[i];
      if (!isDailyDone(q.id, cursor)) {
        var already = state.log.some(function (l) {
          return l.kind === 'penalty' && l.questId === q.id && l.date === cursor;
        });
        if (!already) {
          state.log.push({
            id: uid(), ts: Date.now(), date: cursor, kind: 'penalty',
            questId: q.id, name: q.name, stat: q.stat, xp: -PENALTY
          });
          applied++;
        }
      }
    }
    cursor = addDays(cursor, 1);
    guard++;
  }

  state.lastPenaltyCheck = today;
  save();
  if (applied > 0) {
    setTimeout(function () {
      toast('-' + (applied * PENALTY) + ' XP (' + applied + ' journalière' + (applied > 1 ? 's' : '') + ' manquée' + (applied > 1 ? 's' : '') + ')');
    }, 900);
  }
}

/* ---------- NIVEAUX & TITRES ----------
   Niveau n -> n+1 coûte 100 + 50*(n-1) XP (de plus en plus dur).
------------------------------------------------------------------ */
function levelFromXP(xp) {
  var lvl = 1;
  var need = 100;
  var left = xp;
  while (left >= need) {
    left -= need;
    lvl++;
    need = 100 + 50 * (lvl - 1);
  }
  return { level: lvl, into: left, need: need };
}

function titleForLevel(l) {
  if (l >= 50) return 'Légende vivante';
  if (l >= 40) return 'Grand maître';
  if (l >= 30) return 'Maître';
  if (l >= 25) return 'Expert';
  if (l >= 20) return 'Vétéran';
  if (l >= 15) return 'Confirmé';
  if (l >= 10) return 'Adepte';
  if (l >= 6)  return 'Initié';
  if (l >= 3)  return 'Apprenti';
  return 'Novice';
}

/* ---------- ONGLET : STATS (GRAPHIQUE) ---------- */
var chartRange = 14;

function dailyTotals(days) {
  /* XP cumulée par centre d'intérêt, jour par jour sur les N derniers jours */
  var today = dateKey();
  var startKey = addDays(today, -(days - 1));

  var base = {};
  var k;
  for (k in STATS) base[k] = 0;

  /* XP avant la fenêtre */
  for (var i = 0; i < state.log.length; i++) {
    var l = state.log[i];
    if (l.date < startKey && base[l.stat] !== undefined) base[l.stat] += l.xp;
  }

  var series = {};
  for (k in STATS) series[k] = [];
  var labels = [];
  var running = {};
  for (k in STATS) running[k] = Math.max(0, base[k]);

  for (var d = 0; d < days; d++) {
    var key = addDays(startKey, d);
    labels.push(key);
    for (var j = 0; j < state.log.length; j++) {
      var e = state.log[j];
      if (e.date === key && running[e.stat] !== undefined) running[e.stat] += e.xp;
    }
    for (k in STATS) {
      if (running[k] < 0) running[k] = 0;
      series[k].push(running[k]);
    }
  }
  return { labels: labels, series: series };
}

function drawChart() {
  var canvas = el('chart');
  if (!canvas) return;
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.clientWidth || 320;
  var h = 220;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.height = h + 'px';
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  var data = dailyTotals(chartRange);
  var padL = 36, padR = 10, padT = 10, padB = 24;
  var cw = w - padL - padR;
  var ch = h - padT - padB;

  var max = 10;
  var k;
  for (k in STATS) {
    for (var i = 0; i < data.series[k].length; i++) {
      if (data.series[k][i] > max) max = data.series[k][i];
    }
  }
  max = Math.ceil(max / 10) * 10;

  /* grille */
  ctx.strokeStyle = '#2c2c2e';
  ctx.fillStyle = '#8e8e93';
  ctx.font = '10px -apple-system, sans-serif';
  ctx.lineWidth = 1;
  for (var g = 0; g <= 4; g++) {
    var y = padT + ch - (ch * g / 4);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(max * g / 4), padL - 6, y + 3);
  }

  /* axe X */
  ctx.textAlign = 'center';
  var step = Math.max(1, Math.floor(chartRange / 5));
  for (var x = 0; x < data.labels.length; x += step) {
    var px = padL + (cw * x / Math.max(1, data.labels.length - 1));
    ctx.fillText(shortDate(data.labels[x]), px, h - 6);
  }

  /* courbes */
  for (k in STATS) {
    var color = getComputedStyle(document.documentElement)
      .getPropertyValue('--c-' + k).trim() || '#fff';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (var p = 0; p < data.series[k].length; p++) {
      var xx = padL + (cw * p / Math.max(1, data.series[k].length - 1));
      var yy = padT + ch - (ch * data.series[k][p] / max);
      if (p === 0) ctx.moveTo(xx, yy);
      else ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  }

  var lg = el('chartLegend');
  if (lg) {
    var lh = '';
    for (k in STATS) {
      lh += '<span class="lg">' + statDot(k) + STATS[k].label + '</span>';
    }
    lg.innerHTML = lh;
  }
}

function renderStats() {
  var seg = el('rangeSeg');
  if (seg) {
    var btns = seg.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-r'), 10) === chartRange);
    }
  }
  drawChart();

  var logs = state.log.slice().sort(function (a, b) { return b.ts - a.ts; }).slice(0, 25);
  var box = el('historyList');
  if (!logs.length) {
    box.innerHTML = '<div class="empty small">Pas encore d\'historique.</div>';
    return;
  }
  var html = '';
  for (var j = 0; j < logs.length; j++) {
    var l = logs[j];
    var neg = l.xp < 0;
    var label = l.kind === 'penalty' ? 'Manquée : ' + l.name : (l.name || 'XP');
    html += '<div class="row">' +
      '<div class="grow"><div class="r-title">' + esc(label) + '</div>' +
      '<div class="r-sub">' + statDot(l.stat) + (STATS[l.stat] ? STATS[l.stat].label : '') + ' · ' + shortDate(l.date) + '</div></div>' +
      '<div class="xp' + (neg ? ' neg' : '') + '">' + (neg ? '' : '+') + l.xp + '</div>' +
    '</div>';
  }
  box.innerHTML = html;
}

/* ---------- ONGLET : PLANNING ---------- */
var schedDay = (new Date()).getDay();

function renderSchedule() {
  var seg = el('schedSeg');
  if (seg) {
    var btns = seg.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', parseInt(btns[i].getAttribute('data-d'), 10) === schedDay);
    }
  }
  var slots = (state.schedule[schedDay] || []).slice().sort(function (a, b) {
    return (a.start || '').localeCompare(b.start || '');
  });
  var box = el('schedList');
  if (!slots.length) {
    box.innerHTML = '<div class="empty">Aucun créneau ce jour.</div>';
    return;
  }
  var html = '';
  for (var j = 0; j < slots.length; j++) {
    var s = slots[j];
    html += '<div class="row">' +
      '<div class="time">' + esc(s.start) + '</div>' +
      '<div class="grow"><div class="r-title">' + esc(s.label) + '</div>' +
      (s.end ? '<div class="r-sub">jusqu\'à ' + esc(s.end) + '</div>' : '') + '</div>' +
      '<button class="mini" data-slotdel="' + s.id + '">✕</button>' +
    '</div>';
  }
  box.innerHTML = html;
}

function slotForm() {
  openModal(
    '<h2>Nouveau créneau</h2>' +
    '<label class="field"><span>Activité</span>' +
      '<input type="text" id="slLabel" placeholder="Ex : Salle de sport"></label>' +
    '<div class="btn-row">' +
      '<label class="field" style="flex:1"><span>Début</span><input type="time" id="slStart"></label>' +
      '<label class="field" style="flex:1"><span>Fin (optionnel)</span><input type="time" id="slEnd"></label>' +
    '</div>' +
    '<div class="btn-row">' +
      '<button class="btn secondary" id="slCancel">Annuler</button>' +
      '<button class="btn" id="slSave">Ajouter</button>' +
    '</div>'
  );
  el('slCancel').onclick = closeModal;
  el('slSave').onclick = function () {
    var label = el('slLabel').value.trim();
    var start = el('slStart').value;
    var end = el('slEnd').value;
    if (!label || !start) { toast('Nom et heure de début requis'); return; }
    state.schedule[schedDay].push({ id: uid(), label: label, start: start, end: end });
    save();
    closeModal();
    renderAll();
    toast('Créneau ajouté ✓');
  };
}

/* ---------- AFFICHAGE GLOBAL ---------- */
var currentView = 'today';

function showView(v) {
  currentView = v;
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
  var target = el('view-' + v);
  if (target) target.classList.add('active');
  var tabs = document.querySelectorAll('#tabs button');
  for (var j = 0; j < tabs.length; j++) {
    tabs[j].classList.toggle('active', tabs[j].getAttribute('data-v') === v);
  }
  renderAll();
  window.scrollTo(0, 0);
}

function renderAll() {
  var dateEl = el('headDate');
  if (dateEl) {
    var n = new Date();
    dateEl.textContent = JOURS[n.getDay()].charAt(0).toUpperCase() + JOURS[n.getDay()].slice(1) +
      ' ' + n.getDate() + ' ' + MOIS[n.getMonth()];
  }
  renderToday();
  renderQuests();
  renderProfile();
  renderStats();
  renderSchedule();
}

/* ---------- ÉVÉNEMENTS ---------- */
document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('[data-v]');
  if (b) showView(b.getAttribute('data-v'));
});

/* Aujourd'hui : cocher / modifier / jour précédent-suivant */
el('dailyList').addEventListener('click', function (e) {
  var c = e.target.closest('[data-check]');
  if (c) {
    toggleDaily(c.getAttribute('data-check'), viewDay);
    renderAll();
    return;
  }
  var ed = e.target.closest('[data-edit]');
  if (ed) questForm(ed.getAttribute('data-edit'));
});

if (el('dayPrev')) el('dayPrev').onclick = function () {
  viewDay = addDays(viewDay, -1);
  renderToday();
};
if (el('dayNext')) el('dayNext').onclick = function () {
  if (viewDay < dateKey()) { viewDay = addDays(viewDay, 1); renderToday(); }
};

/* Quêtes : filtre, terminer, restaurer, modifier */
if (el('questSeg')) el('questSeg').addEventListener('click', function (e) {
  var b = e.target.closest('[data-f]');
  if (!b) return;
  questFilter = b.getAttribute('data-f');
  renderQuests();
});

el('questList').addEventListener('click', function (e) {
  var c = e.target.closest('[data-complete]');
  if (c) { completeQuest(c.getAttribute('data-complete')); renderAll(); return; }
  var r = e.target.closest('[data-restore]');
  if (r) { restoreQuest(r.getAttribute('data-restore')); renderAll(); return; }
  var ed = e.target.closest('[data-edit]');
  if (ed) questForm(ed.getAttribute('data-edit'));
});

/* Stats : période */
if (el('rangeSeg')) el('rangeSeg').addEventListener('click', function (e) {
  var b = e.target.closest('[data-r]');
  if (!b) return;
  chartRange = parseInt(b.getAttribute('data-r'), 10);
  renderStats();
});

/* Planning : jour, ajout, suppression */
if (el('schedSeg')) el('schedSeg').addEventListener('click', function (e) {
  var b = e.target.closest('[data-d]');
  if (!b) return;
  schedDay = parseInt(b.getAttribute('data-d'), 10);
  renderSchedule();
});
if (el('btnAddSlot')) el('btnAddSlot').onclick = slotForm;
el('schedList').addEventListener('click', function (e) {
  var d = e.target.closest('[data-slotdel]');
  if (!d) return;
  var id = d.getAttribute('data-slotdel');
  state.schedule[schedDay] = state.schedule[schedDay].filter(function (s) { return s.id !== id; });
  save();
  renderSchedule();
  renderToday();
});

/* Boutons d'ajout et réglages */
var addBtns = document.querySelectorAll('[data-add]');
for (var ab = 0; ab < addBtns.length; ab++) {
  addBtns[ab].addEventListener('click', function () {
    var t = this.getAttribute('data-add');
    questForm(null, TYPES[t] ? t : (currentView === 'quests' ? questFilter : 'journaliere'));
  });
}
if (el('btnAdd')) el('btnAdd').onclick = function () {
  questForm(null, currentView === 'quests' && questFilter !== 'archives' ? questFilter : 'journaliere');
};
if (el('btnSettings')) el('btnSettings').onclick = openSettings;

window.addEventListener('resize', function () {
  if (currentView === 'stats') drawChart();
});

/* ---------- DÉMARRAGE ---------- */
load();
applyPenalties();
renderAll();

/* Si l'appli reste ouverte et que minuit passe */
setInterval(function () {
  var today = dateKey();
  if (state.lastPenaltyCheck !== today) {
    if (viewDay === state.lastPenaltyCheck) viewDay = today;
    applyPenalties();
    renderAll();
  }
}, 60000);
</script>
</body>
</html>
