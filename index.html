<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jeu de la Vie">
<title>Jeu de la Vie</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--muted:#98989f;--text:#f5f5f7;--line:#38383a;--blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--purple:#BF5AF2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:90px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px}
.topbar small{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.topbar h1{margin:2px 0 16px;font-size:34px;font-weight:800}
.view{display:none}.view.active{display:block}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;width:0;transition:width .5s}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.big{font-size:22px;font-weight:800}
.muted{color:var(--muted);font-size:13px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.section-head h2{margin:0;font-size:18px}
.section-head span{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{background:var(--card);padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
.chip.active{background:var(--blue)}
.quest{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:15px}
.check.on{background:var(--green);border-color:var(--green);color:#000}
.quest.done .qname{text-decoration:line-through;color:var(--muted)}
.qname{font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);margin-right:4px;display:inline-block}
.del{color:var(--muted);font-size:22px;padding:0 6px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(28,28,30,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 24px}
.tab b{font-size:22px;font-weight:400}
.tab.active{color:var(--blue)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:56px;height:56px;border-radius:50%;background:var(--blue);font-size:30px;z-index:15;box-shadow:0 6px 20px rgba(10,132,255,.4)}
.modal-bg,.lu{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none}
.modal-bg.open,.lu.open{display:flex}
.modal-bg{align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px}
.field{width:100%;background:var(--card2);border-radius:12px;padding:12px;border:0;margin-bottom:12px;outline:none}
.btn{background:var(--blue);padding:13px;border-radius:12px;font-weight:700;width:100%;margin-top:6px}
.btn.ghost{background:var(--card2)}
.btn.danger{background:var(--red)}
.pill{display:inline-block;background:var(--card2);padding:8px 12px;border-radius:99px;margin:0 6px 8px 0;font-size:14px}
.pill.sel{background:var(--blue)}
.lu{align-items:center;justify-content:center;text-align:center;flex-direction:column}
.lu h1{font-size:44px;margin:0;color:var(--orange)}
.lu p{font-size:18px;margin:8px 0 20px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--card2);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{background:var(--card);border-radius:16px;padding:14px}
.mini small{color:var(--muted);display:block;font-size:12px}
.mini b{font-size:24px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:14px}
.seg button.active{background:var(--card2)}
svg.chart{width:100%;height:auto}
svg.chart text{fill:#98989f;font-size:11px}
svg.chart line{stroke:#38383a}
.hist{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><small>Jeu de la vie</small><h1 id="pageTitle">Profil</h1></div>
  <div id="profileView" class="view active"></div>
  <div id="questsView" class="view"></div>
  <div id="statsView" class="view"></div>
</div>

<button class="fab" id="fab" data-action="new-quest" style="display:none">＋</button>

<nav class="tabbar">
  <button class="tab active" data-action="tab" data-t="profile"><b>👤</b>Profil</button>
  <button class="tab" data-action="tab" data-t="quests"><b>⚔️</b>Quêtes</button>
  <button class="tab" data-action="tab" data-t="stats"><b>📊</b>Stats</button>
</nav>

<div class="modal-bg" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="lu" id="levelup">
  <div style="font-size:60px">✨</div><h1>LEVEL UP</h1>
  <p id="luText"></p>
  <button class="btn" style="width:auto;padding:12px 36px" data-action="close-lu">Continuer</button>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const STORE = 'jdlv_v1';

/* ===== CATÉGORIES ===== */
const CATS = {
  sport:   {name:'Sport',        icon:'💪', color:'#FF453A'},
  med:     {name:'Méditation',   icon:'🧘', color:'#BF5AF2'},
  philo:   {name:'Philosophie',  icon:'📚', color:'#FF9F0A'},
  elec:    {name:'Électronique', icon:'⚡', color:'#0A84FF'}
};
const OVERALL = {name:'Overall', icon:'🌟', color:'#30D158'};
const DIFF = {
  1:{label:'Facile', xp:10},
  2:{label:'Moyen',  xp:25},
  3:{label:'Dur',    xp:50}
};
const DAYS = ['L','M','M','J','V','S','D'];

/* ===== DATES ===== */
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function parseKey(k){ const p=k.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(k, n){ const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
function dow(k){ return (parseKey(k).getDay()+6)%7; } /* 0 = lundi */

/* ===== NIVEAUX ===== */
function xpForLevel(l){ return 100*l; }
function levelInfo(total){
  let lvl=1, left=Math.max(0,total);
  while(left >= xpForLevel(lvl)){ left -= xpForLevel(lvl); lvl++; }
  return {lvl:lvl, cur:left, need:xpForLevel(lvl)};
}

/* ===== ÉTAT ===== */
function freshState(){
  return {
    xp:{sport:0, med:0, philo:0, elec:0},
    quests:[],
    log:{},
    created:todayKey(),
    lastCheck:todayKey()
  };
}
let state = freshState();
let tab = 'profile';
let filter = 'all';
let statMode = 'day';

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const p = JSON.parse(raw);
      state = Object.assign(freshState(), p);
      state.xp = Object.assign({sport:0,med:0,philo:0,elec:0}, p.xp||{});
      if(!Array.isArray(state.quests)) state.quests=[];
      if(!state.log) state.log={};
    }
  }catch(e){ state = freshState(); }
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
}

function totalXP(){
  return state.xp.sport + state.xp.med + state.xp.philo + state.xp.elec;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ===== QUÊTES ===== */
function questActiveOn(q, key){
  if(q.type==='daily') return true;
  if(q.type==='weekly') return (q.days||[]).indexOf(dow(key)) !== -1;
  if(q.type==='once') return q.date === key;
  return false;
}
function isDone(q, key){
  const l = state.log[key];
  return !!(l && l.done && l.done.indexOf(q.id) !== -1);
}
function questsFor(key){
  return state.quests.filter(q => !q.deleted && questActiveOn(q, key));
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function ensureLog(key){
  if(!state.log[key]) state.log[key] = {done:[], gain:{sport:0,med:0,philo:0,elec:0}};
  return state.log[key];
}
function gainXP(key, cat){
  const l = state.log[key];
  return l && l.gain ? (l.gain[cat]||0) : 0;
}

/* ===== GAIN / PERTE D'XP ===== */
function addXP(cat, amount, key){
  const before = levelInfo(totalXP()).lvl;
  const l = ensureLog(key);
  const prev = state.xp[cat];
  state.xp[cat] = Math.max(0, prev + amount);
  l.gain[cat] = (l.gain[cat]||0) + (state.xp[cat] - prev);
  const after = levelInfo(totalXP()).lvl;
  if(after > before){
    $('#luText').textContent = 'Tu passes niveau ' + after + ' !';
    $('#levelup').classList.add('open');
  }
}

function toggleQuest(id){
  const q = state.quests.find(x => x.id === id);
  if(!q) return;
  const key = todayKey();
  const l = ensureLog(key);
  const i = l.done.indexOf(id);
  const xp = DIFF[q.diff].xp;
  if(i === -1){
    l.done.push(id);
    addXP(q.cat, xp, key);
    toast('+' + xp + ' XP ' + CATS[q.cat].icon);
  } else {
    l.done.splice(i, 1);
    addXP(q.cat, -xp, key);
  }
  save(); render();
}

/* ===== PÉNALITÉS (quêtes ratées les jours passés) ===== */
function applyPenalties(){
  const today = todayKey();
  let from = state.lastCheck || today;
  let lost = 0;
  let guard = 0;
  while(from < today && guard < 400){
    guard++;
    const l = ensureLog(from);
    if(!l.penalized){
      questsFor(from).forEach(q => {
        if(q.createdOn && q.createdOn > from) return;
        if(!isDone(q, from)){
          const pen = Math.round(DIFF[q.diff].xp / 2);
          const prev = state.xp[q.cat];
          state.xp[q.cat] = Math.max(0, prev - pen);
          lost += prev - state.xp[q.cat];
          l.gain[q.cat] = (l.gain[q.cat]||0) - pen;
        }
      });
      l.penalized = true;
    }
    from = addDays(from, 1);
  }
  state.lastCheck = today;
  save();
  if(lost > 0) setTimeout(() => toast('−' + lost + ' XP (quêtes manquées)'), 600);
}
/* ===== OUTILS D'AFFICHAGE ===== */
function esc(s){
  return String(s).split('&').join('&').split('<').join('<').split('>').join('>').split('"').join('"').split("'").join(''');
}
function ring(pct, color, size){
  const r = size/2 - 6, c = 2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#2c2c2e" stroke-width="6"/>'
    + '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round" '
    + 'stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')"/></svg>';
}

/* ===== PROFIL ===== */
function renderProfile(){
  const tot = levelInfo(totalXP());
  let h = '<div style="background:#1c1c1e;border-radius:20px;padding:18px;margin-bottom:12px;text-align:center">'
    + '<div style="position:relative;width:140px;height:140px;margin:0 auto">' + ring(tot.cur/tot.need, OVERALL.color, 140)
    + '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">'
    + '<small style="color:#98989f">'+OVERALL.icon+' Overall</small><b style="font-size:34px">'+tot.lvl+'</b></div></div>'
    + '<div style="color:#98989f;font-size:13px;margin-top:8px">'+tot.cur+' / '+tot.need+' XP</div></div>';
  Object.keys(CATS).forEach(k => {
    const c = CATS[k], li = levelInfo(state.xp[k]);
    h += '<div style="background:#1c1c1e;border-radius:16px;padding:14px;margin-bottom:10px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center"><b>'+c.icon+' '+c.name+'</b>'
      + '<span style="color:'+c.color+';font-weight:700">Niv. '+li.lvl+'</span></div>'
      + '<div style="height:8px;background:#2c2c2e;border-radius:99px;margin-top:10px;overflow:hidden">'
      + '<div style="height:100%;width:'+Math.round(li.cur/li.need*100)+'%;background:'+c.color+'"></div></div>'
      + '<div style="color:#98989f;font-size:12px;margin-top:6px">'+li.cur+' / '+li.need+' XP</div></div>';
  });
  h += '<div style="display:flex;gap:10px;margin-top:14px">'
    + '<button class="btn" style="flex:1;background:#2c2c2e;padding:12px;border-radius:12px" data-action="export">Exporter</button>'
    + '<button class="btn" style="flex:1;background:#2c2c2e;padding:12px;border-radius:12px" data-action="import">Importer</button></div>';
  $('#profileView').innerHTML = h;
}

/* ===== QUÊTES ===== */
function renderQuests(){
  const key = todayKey();
  const list = questsFor(key);
  const done = list.filter(q => isDone(q, key)).length;
  let h = '<div class="summary"><div class="mini"><small>Aujourd\'hui</small><b>'+done+' / '+list.length+'</b></div>'
    + '<div class="mini"><small>XP total</small><b>'+totalXP()+'</b></div></div>';
  h += '<div class="seg"><button class="'+(filter==='all'?'active':'')+'" data-action="filter" data-f="all">Toutes</button>';
  Object.keys(CATS).forEach(k => {
    h += '<button class="'+(filter===k?'active':'')+'" data-action="filter" data-f="'+k+'">'+CATS[k].icon+'</button>';
  });
  h += '</div>';
  const shown = list.filter(q => filter==='all' || q.cat===filter);
  if(!shown.length) h += '<p style="color:#98989f;text-align:center;margin-top:30px">Aucune quête.<br>Appuie sur ＋ pour en créer une.</p>';
  shown.forEach(q => {
    const c = CATS[q.cat], d = isDone(q, key);
    h += '<div style="display:flex;align-items:center;gap:12px;background:#1c1c1e;border-radius:16px;padding:14px;margin-bottom:8px;'+(d?'opacity:.5':'')+'">'
      + '<button data-action="toggle" data-id="'+q.id+'" style="width:30px;height:30px;border-radius:50%;border:2px solid '+c.color+';background:'+(d?c.color:'transparent')+';color:#000;font-weight:900">'+(d?'✓':'')+'</button>'
      + '<div style="flex:1"><div style="font-weight:600;'+(d?'text-decoration:line-through':'')+'">'+esc(q.title)+'</div>'
      + '<small style="color:#98989f">'+c.icon+' '+c.name+' · '+DIFF[q.diff].label+' · +'+DIFF[q.diff].xp+' XP</small></div>'
      + '<button data-action="del" data-id="'+q.id+'" style="color:#98989f;font-size:18px">🗑</button></div>';
  });
  $('#questsView').innerHTML = h;
}

/* ===== STATS ===== */
function seriesFor(n){
  const out = [], today = todayKey();
  for(let i=n-1;i>=0;i--){
    const k = addDays(today, -i);
    const l = state.log[k];
    let v = 0;
    if(l && l.gain) Object.keys(CATS).forEach(c => v += (l.gain[c]||0));
    out.push({k:k, v:v});
  }
  return out;
}
function chartSVG(data){
  const W=320, H=140, max = Math.max(10, ...data.map(d => Math.abs(d.v)));
  const bw = W/data.length;
  let out = '<svg class="chart" viewBox="0 0 '+W+' '+(H+20)+'"><line x1="0" y1="'+(H/2)+'" x2="'+W+'" y2="'+(H/2)+'"/>';
  data.forEach((d,i) => {
    const hgt = Math.abs(d.v)/max*(H/2-4);
    const y = d.v >= 0 ? H/2-hgt : H/2;
    out += '<rect x="'+(i*bw+bw*0.15)+'" y="'+y+'" width="'+(bw*0.7)+'" height="'+Math.max(1,hgt)+'" rx="2" fill="'+(d.v>=0?'#30D158':'#FF453A')+'"/>';
  });
  return out + '</svg>';
}
function renderStats(){
  const n = statMode==='day' ? 7 : statMode==='week' ? 28 : 90;
  const data = seriesFor(n);
  const sum = data.reduce((a,d) => a + d.v, 0);
  let h = '<div class="seg">'
    + '<button class="'+(statMode==='day'?'active':'')+'" data-action="smode" data-m="day">7 jours</button>'
    + '<button class="'+(statMode==='week'?'active':'')+'" data-action="smode" data-m="week">28 jours</button>'
    + '<button class="'+(statMode==='month'?'active':'')+'" data-action="smode" data-m="month">90 jours</button></div>';
  h += '<div class="summary"><div class="mini"><small>XP sur la période</small><b>'+(sum>=0?'+':'')+sum+'</b></div>'
    + '<div class="mini"><small>Niveau global</small><b>'+levelInfo(totalXP()).lvl+'</b></div></div>';
  h += '<div style="background:#1c1c1e;border-radius:16px;padding:14px;margin-bottom:12px">'+chartSVG(data)+'</div>';
  h += '<div style="background:#1c1c1e;border-radius:16px;padding:6px 14px">';
  data.slice().reverse().slice(0,10).forEach(d => {
    h += '<div class="hist"><span>'+parseKey(d.k).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+'</span>'
      + '<b style="color:'+(d.v>=0?'#30D158':'#FF453A')+'">'+(d.v>=0?'+':'')+d.v+' XP</b></div>';
  });
  h += '</div>';
  $('#statsView').innerHTML = h;
}

/* ===== RENDU GLOBAL ===== */
function render(){
  const titles = {profile:'Profil', quests:'Quêtes', stats:'Stats'};
  $('#pageTitle').textContent = titles[tab];
  ['profile','quests','stats'].forEach(t => {
    const v = $('#'+t+'View');
    if(v) v.style.display = (t===tab) ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t===tab));
  $('#fab').style.display = tab==='quests' ? 'block' : 'none';
  if(tab==='profile') renderProfile();
  if(tab==='quests') renderQuests();
  if(tab==='stats') renderStats();
}

/* ===== CRÉATION D'UNE QUÊTE ===== */
let draft = null;
function openNew(){
  draft = {title:'', cat:'sport', diff:2, type:'daily', days:[]};
  drawSheet();
  $('#modal').classList.add('open');
}
function drawSheet(){
  let h = '<h2 style="margin:0 0 14px">Nouvelle quête</h2>'
    + '<input id="qTitle" placeholder="Nom de la quête" value="'+esc(draft.title)+'" style="width:100%;padding:12px;border-radius:12px;border:0;background:#2c2c2e;margin-bottom:14px">'
    + '<small style="color:#98989f">Catégorie</small><div class="seg" style="margin-top:6px">';
  Object.keys(CATS).forEach(k => {
    h += '<button class="'+(draft.cat===k?'active':'')+'" data-action="dcat" data-v="'+k+'">'+CATS[k].icon+'</button>';
  });
  h += '</div><small style="color:#98989f">Difficulté</small><div class="seg" style="margin-top:6px">';
  [1,2,3].forEach(d => {
    h += '<button class="'+(draft.diff===d?'active':'')+'" data-action="ddiff" data-v="'+d+'">'+DIFF[d].label+' (+'+DIFF[d].xp+')</button>';
  });
  h += '</div><small style="color:#98989f">Répétition</small><div class="seg" style="margin-top:6px">'
    + '<button class="'+(draft.type==='daily'?'active':'')+'" data-action="dtype" data-v="daily">Chaque jour</button>'
    + '<button class="'+(draft.type==='weekly'?'active':'')+'" data-action="dtype" data-v="weekly">Certains jours</button>'
    + '<button class="'+(draft.type==='once'?'active':'')+'" data-action="dtype" data-v="once">Une fois</button></div>';
  if(draft.type==='weekly'){
    h += '<div class="seg">';
    DAYS.forEach((d,i) => {
      h += '<button class="'+(draft.days.indexOf(i)!==-1?'active':'')+'" data-action="dday" data-v="'+i+'">'+d+'</button>';
    });
    h += '</div>';
  }
  h += '<div style="display:flex;gap:10px;margin-top:10px">'
    + '<button class="btn" style="flex:1;background:#2c2c2e;padding:12px;border-radius:12px" data-action="cancel">Annuler</button>'
    + '<button class="btn" style="flex:1;background:#0A84FF;padding:12px;border-radius:12px;font-weight:700" data-action="create">Créer</button></div>';
  $('#sheet').innerHTML = h;
}
function createQuest(){
  const t = $('#qTitle') ? $('#qTitle').value.trim() : '';
  if(!t){ toast('Donne un nom à la quête'); return; }
  if(draft.type==='weekly' && !draft.days.length){ toast('Choisis au moins un jour'); return; }
  state.quests.push({
    id:uid(), title:t, cat:draft.cat, diff:draft.diff, type:draft.type,
    days:draft.days.slice(), date:todayKey(), createdOn:todayKey()
  });
  save();
  $('#modal').classList.remove('open');
  render();
}

/* ===== EXPORT / IMPORT ===== */
function doExport(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jeu-de-la-vie.json';
  a.click();
}
function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      state = Object.assign(freshState(), p);
      save(); render(); toast('Import réussi');
    }catch(e){ toast('Fichier invalide'); }
  };
  r.readAsText(file);
}

/* ===== BOUTONS ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  if(a==='tab'){ tab = el.dataset.t; render(); }
  else if(a==='filter'){ filter = el.dataset.f; render(); }
  else if(a==='toggle'){ toggleQuest(el.dataset.id); }
  else if(a==='del'){
    if(confirm('Supprimer cette quête ?')){
      const q = state.quests.find(x => x.id===el.dataset.id);
      if(q) q.deleted = true;
      save(); render();
    }
  }
  else if(a==='smode'){ statMode = el.dataset.m; render(); }
  else if(a==='new-quest'){ openNew(); }
  else if(a==='dcat'){ draft.title = $('#qTitle').value; draft.cat = el.dataset.v; drawSheet(); }
  else if(a==='ddiff'){ draft.title = $('#qTitle').value; draft.diff = +el.dataset.v; drawSheet(); }
  else if(a==='dtype'){ draft.title = $('#qTitle').value; draft.type = el.dataset.v; drawSheet(); }
  else if(a==='dday'){
    draft.title = $('#qTitle').value;
    const v = +el.dataset.v, i = draft.days.indexOf(v);
    if(i===-1) draft.days.push(v); else draft.days.splice(i,1);
    drawSheet();
  }
  else if(a==='cancel'){ $('#modal').classList.remove('open'); }
  else if(a==='create'){ createQuest(); }
  else if(a==='close-lu'){ $('#levelup').classList.remove('open'); }
  else if(a==='export'){ doExport(); }
  else if(a==='import'){ $('#importFile').click(); }
});
$('#importFile').addEventListener('change', e => {
  if(e.target.files[0]) doImport(e.target.files[0]);
});

/* ===== DÉMARRAGE ===== */
load();
applyPenalties();
render();
})();
</script>
</body>
</html>
