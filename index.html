<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1220">
<title>Jeu de la vie</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--card2:#20253d;--line:#2c3252;--txt:#e8eaf6;--mut:#8a90b4;--acc:#7c5cff;--ok:#3ecf8e;--bad:#ff5c6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding-bottom:84px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header .sub{font-size:12px;color:var(--mut)}
.hbtns{display:flex;gap:8px}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.ibtn.plus{background:var(--acc);border-color:var(--acc)}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}

/* Mouvement léger : cartes vivantes, lisibles et économes sur mobile */
.card{position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(120deg,transparent 15%,rgba(255,255,255,.22),transparent 55%);background-size:220% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:borderSweep 7s linear infinite}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.22)}
.view.on .card{animation:cardIn .42s both}
.view.on .card:nth-child(2){animation-delay:.06s}.view.on .card:nth-child(3){animation-delay:.12s}
.stat{--interest:#7c5cff;padding:9px 10px;border-radius:12px;transition:background .25s ease,box-shadow .25s ease}
.stat:hover{background:color-mix(in srgb,var(--interest) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--interest) 35%,transparent)}
.stat .bar{box-shadow:0 0 0 1px color-mix(in srgb,var(--interest) 20%,transparent)}
.stat .bar>i{box-shadow:0 0 12px color-mix(in srgb,var(--interest) 60%,transparent);position:relative;overflow:hidden}
.stat .bar>i::after,.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 20%,rgba(255,255,255,.7) 50%,transparent 80%);background-size:180% 100%;animation:shine 2.8s ease-in-out infinite}
.big .lv,.big .ti{animation:shimmer 4s ease-in-out infinite;background:linear-gradient(105deg,var(--txt) 35%,#fff 50%,var(--txt) 65%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.big .lv{filter:drop-shadow(0 0 14px rgba(124,92,255,.35))}
.big.high .lv{animation:rankPulse 2.8s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,210,63,.6))}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes borderSweep{to{background-position:-220% 0}}
@keyframes shine{0%,35%{background-position:180% 0}70%,100%{background-position:-80% 0}}
@keyframes shimmer{0%,100%{background-position:180% 0}50%{background-position:-80% 0}}
@keyframes rankPulse{0%,100%{transform:scale(1);text-shadow:0 0 0 transparent}50%{transform:scale(1.04);text-shadow:0 0 24px rgba(255,210,63,.55)}}

/* Dix atmosphères de progression, CSS uniquement et limité à chaque carte. */
.stat[data-theme]{position:relative;overflow:hidden;isolation:isolate;border:1px solid color-mix(in srgb,var(--interest) 26%,transparent)}
.stat[data-theme]>*{position:relative;z-index:1}
.stat[data-theme]::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.48;background-size:180% 180%;animation:themeDrift 12s ease-in-out infinite}
.stat[data-theme]::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.22}
.stat[data-theme="vinland"]{border-image:linear-gradient(135deg,#9cecff,#536f8a,#d8e7df) 1;box-shadow:inset 0 0 24px #3e8cb022}
.stat[data-theme="vinland"]::before{background:radial-gradient(ellipse at 14% 115%,#d8f7ff44,transparent 44%),radial-gradient(ellipse at 80% -30%,#a7c8d833,transparent 50%),linear-gradient(110deg,transparent,#e0f4ff0a,transparent)}
.stat[data-theme="vinland"]::after{background:repeating-linear-gradient(135deg,transparent 0 18px,#d8e7df10 19px 20px)}
.stat[data-theme="cyberpunk"]{box-shadow:inset 0 0 25px #ff1da522,0 0 12px #16edff12}
.stat[data-theme="cyberpunk"]::before{background:linear-gradient(115deg,#ff00a822,transparent 40%,#00f0ff1b),linear-gradient(0deg,transparent 75%,#00f0ff13 75% 76%,transparent 77%);background-size:180% 180%,100% 7px}
.stat[data-theme="cyberpunk"]::after{background:linear-gradient(90deg,transparent 49.5%,#00f0ff12 50%,transparent 50.5%),linear-gradient(0deg,transparent 49.5%,#ff00a817 50%,transparent 50.5%);background-size:24px 24px;mask-image:linear-gradient(90deg,#000,transparent)}
.stat[data-theme="forge"]{box-shadow:inset 0 -14px 24px #ff57221b}
.stat[data-theme="forge"]::before{background:radial-gradient(ellipse at 35% 125%,#ff541c55,transparent 48%),radial-gradient(ellipse at 82% 110%,#ffc85738,transparent 35%)}
.stat[data-theme="forge"]::after{background:radial-gradient(circle at 18% 80%,#ffd17855 0 1px,transparent 2px),radial-gradient(circle at 70% 66%,#ff7b3b55 0 1px,transparent 2px);background-size:54px 34px;animation:embers 7s linear infinite}
.stat[data-theme="antique"]{background-image:linear-gradient(110deg,#3a2b241c,#b38c4920)!important}
.stat[data-theme="antique"]::before{background:repeating-linear-gradient(0deg,transparent 0 5px,#e9d4a10b 6px,#e9d4a10b 7px),radial-gradient(ellipse at 90% 10%,#e5c67a20,transparent 48%)}
.stat[data-theme="antique"]::after{inset:5px;border:1px solid #d9b86c55;border-radius:8px}
.stat[data-theme="cosmos"]::before{background:radial-gradient(circle at 18% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 72% 68%,#c3dbff 0 1px,transparent 2px),radial-gradient(ellipse at 60% 0%,#6861ff28,transparent 55%);background-size:71px 47px,93px 61px,100% 100%}
.stat[data-theme="cosmos"]::after{background:radial-gradient(ellipse at 50% 130%,#5750b922,transparent 65%)}
.stat[data-theme="ocean"]::before{background:repeating-radial-gradient(ellipse at 50% 115%,transparent 0 10px,#3bc9dc20 11px 12px,transparent 13px 23px),linear-gradient(125deg,#44d2ed12,transparent)}
.stat[data-theme="ocean"]::after{background:linear-gradient(165deg,transparent 45%,#66e4ee14 46% 47%,transparent 48%)}
.stat[data-theme="forest"]::before{background:radial-gradient(ellipse at 12% 110%,#53c98c30,transparent 42%),radial-gradient(ellipse at 88% -20%,#a1d66e20,transparent 45%)}
.stat[data-theme="forest"]::after{background:radial-gradient(ellipse at 15% 10%,#b9df762b 0 3px,transparent 4px),radial-gradient(ellipse at 85% 70%,#57bd832b 0 4px,transparent 5px);background-size:47px 41px;animation:leafDrift 9s ease-in-out infinite}
.stat[data-theme="samurai"]::before{background:radial-gradient(ellipse at 80% -15%,#fb9bbb2b,transparent 44%),linear-gradient(135deg,transparent 48%,#ffe5ed18 49%,transparent 50%)}
.stat[data-theme="samurai"]::after{background:radial-gradient(ellipse at 21% 36%,#ffc0d444 0 2px,transparent 3px),radial-gradient(ellipse at 73% 76%,#ff9ebb40 0 2px,transparent 3px);background-size:53px 44px;animation:petalFall 12s linear infinite}
.stat[data-theme="matrix"]::before{background:repeating-linear-gradient(90deg,transparent 0 16px,#62ff8120 17px 18px),linear-gradient(0deg,transparent,#42ff6b18);mask-image:linear-gradient(180deg,#000,transparent 85%)}
.stat[data-theme="matrix"]::after{background:repeating-linear-gradient(0deg,transparent 0 3px,#63ff7811 4px 5px);background-size:100% 5px}
.stat[data-theme="aurora"]::before{background:linear-gradient(115deg,#35e6c51c,#4b83ff22,#ed76ca1b,#c9f48720);background-size:240% 240%;filter:blur(2px)}
.stat[data-theme="aurora"]::after{inset:0 0 50%;background:linear-gradient(180deg,#b1ffe219,transparent)}
.stat .interest-title{display:inline-block;transform-origin:left center}
.stat[data-theme="cyberpunk"] .interest-title{text-shadow:1px 0 #ff38be,-1px 0 #27eaff;animation:glitch 5s steps(1) infinite}
.stat[data-theme="vinland"] .interest-title{text-shadow:0 0 10px #8ad9eb99}
.stat[data-theme="forge"] .interest-title,.stat[data-theme="aurora"] .interest-title{animation:rankGlow 3s ease-in-out infinite alternate}
.stat[data-theme="antique"] .interest-title{font-variant:small-caps;letter-spacing:.04em}
@keyframes themeDrift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes embers{to{background-position:0 -90px,12px -60px}}
@keyframes leafDrift{50%{transform:translateY(-3px) rotate(1deg)}}
@keyframes petalFall{to{background-position:20px 95px,-20px 80px}}
@keyframes glitch{0%,94%,100%{transform:none}95%{transform:translateX(1px)}96%{transform:translateX(-1px)}}
@keyframes rankGlow{to{text-shadow:0 0 12px color-mix(in srgb,var(--interest) 70%,transparent)}}
.theme-preview{padding:12px;border-radius:12px;margin-top:10px;background:var(--card2);color:var(--txt);border:1px solid var(--line);min-height:42px}
.interest-row{padding:10px;background:var(--card2);border-radius:12px;margin:8px 0}
@media (prefers-reduced-motion:reduce){.stat[data-theme]::before,.stat[data-theme]::after,.interest-title{animation:none!important}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.card:hover{transform:none}}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .3s}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.mut{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:18px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);border-radius:12px;margin-bottom:8px}
.item.done{opacity:.55}.item.done .t{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.item.done .chk{background:var(--ok);border-color:var(--ok);color:#06220f}
.item.fail .chk{background:var(--bad);border-color:var(--bad)}
.t{font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);margin-right:4px}
.xp{font-size:12px;color:var(--ok);font-weight:700;white-space:nowrap}
.mini{padding:6px 10px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12px}
.btn{width:100%;padding:12px;border-radius:12px;background:var(--acc);font-weight:700;margin-top:14px}
.btn.sec{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.seg button.on{background:var(--acc);border-color:var(--acc);font-weight:700}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.daynav .d{font-weight:700;text-align:center}
.stat{margin-bottom:14px}
.stat .top{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px}
.big{text-align:center;padding:6px 0 4px}
.big .lv{font-size:44px;font-weight:800;line-height:1}
.big .ti{color:var(--mut);margin-top:4px}
canvas{width:100%;height:210px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--mut)}
.slot{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card2);border-radius:10px;margin-bottom:6px}
.slot .h{color:var(--mut);font-size:12px;min-width:92px}
.slot .l{flex:1;font-weight:600}
.slot .x{color:var(--bad)}
.row2{display:flex;gap:8px;margin-top:8px}
.days{display:flex;gap:6px;margin-top:4px}
.days button{flex:1;padding:9px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.days button.on{background:var(--acc);border-color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:8px 12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.chips button.on{border-width:2px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(15,18,32,.96);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;padding:6px 0;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}
nav button.on{color:var(--txt)}
#overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#overlay.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 4px;font-size:18px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.slot{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.slot .t{font-size:13px;color:var(--mut);min-width:96px}
.slot .n{flex:1}
.slot .x{color:var(--bad);font-size:18px;padding:0 6px}
</style>
</head>
<body>
<header>
  <div><h1 id="hName">Joueur</h1><div class="sub" id="hSub"></div></div>
  <div class="hbtns"><button class="ibtn plus" id="btnAdd">+</button><button class="ibtn" id="btnSettings">⚙</button></div>
</header>
<main>
  <section class="view on" id="v-today">
    <div class="daynav"><button id="dayPrev">‹</button><div class="d" id="dayLabel"></div><button id="dayNext">›</button></div>
    <div class="card"><div class="row"><div class="sp"><div id="dayProg" class="t">0/0</div><div class="mut" id="dayXp"></div></div></div>
      <div class="bar" style="margin-top:10px"><i id="dayBar" style="width:0;background:var(--acc)"></i></div></div>
    <div class="card"><h3>Planning du jour</h3><div id="daySched"></div></div>
    <div class="card"><h3>Quêtes journalières</h3><div id="dailyList"></div></div>
  </section>
  <section class="view" id="v-quests">
    <div class="seg" id="questSeg">
      <button data-f="commune" class="on">Communes</button><button data-f="epique">Épiques</button>
      <button data-f="legendaire">Légendaires</button><button data-f="archives">Archives</button>
    </div>
    <div id="questList"></div>
  </section>
  <section class="view" id="v-profile">
    <div class="card"><div class="big"><div class="lv" id="ovLv">1</div><div class="ti" id="ovTi"></div></div>
      <div class="bar" style="margin-top:12px"><i id="ovBar" style="width:0;background:var(--acc)"></i></div>
      <div class="mut" id="ovXp" style="text-align:center;margin-top:6px"></div></div>
    <div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0" class="sp">Centres d'intérêt</h3><button class="mini" id="btnInterests">Gérer</button></div><div id="statList"></div></div>
  </section>
  <section class="view" id="v-stats">
    <div class="seg" id="rangeSeg">
      <button data-r="7" class="on">Semaine</button><button data-r="30">Mois</button>
      <button data-r="90">3 mois</button><button data-r="365">Année</button>
    </div>
    <div class="card"><h3>XP gagnée</h3><canvas id="chart"></canvas><div class="legend" id="chartLegend"></div></div>
    <div class="card"><h3>Résumé</h3><div id="sumBox"></div></div>
  </section>
  <section class="view" id="v-plan">
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h3 style="margin:0">Créneaux</h3>
      <button id="btnAddSlot" class="ibtn plus">+</button>
    </div>
    <div id="schedDays" class="seg"></div>
    <div id="schedList" style="margin-top:12px"></div>
  </div>
  </section>
</main>
<nav id="nav">
  <button data-v="today" class="on"><b>☀</b>Aujourd'hui</button>
  <button data-v="quests"><b>⚔</b>Quêtes</button>
  <button data-v="profile"><b>★</b>Profil</button>
  <button data-v="stats"><b>▥</b>Stats</button>
  <button data-v="plan"><b>◷</b>Planning</button>
</nav>
<div id="overlay"><div id="sheet"></div></div>
<div id="toast"></div>

<script>
var DEFAULT_INTERESTS=[
  {id:'sport',label:'Sport',hex:'#ff7a45',emoji:'🔥',theme:'forge',titles:['Novice','Sportif','Athlète','Champion','Colosse','Titan']},
  {id:'meditation',label:'Méditation',hex:'#4cc9f0',emoji:'ᚱ',theme:'vinland',titles:['Éveillé','Apaisé','Serein','Sage','Moine','Bouddha']},
  {id:'philosophie',label:'Philosophie',hex:'#b388ff',emoji:'🏛️',theme:'antique',titles:['Curieux','Penseur','Raisonneur','Stoïcien','Philosophe','Socrate']},
  {id:'electronique',label:'Électronique',hex:'#ffd23f',emoji:'⌁',theme:'cyberpunk',titles:['Bidouilleur','Technicien','Ingénieur','Concepteur','Maître','Tesla']}
];
var THEMES=[['vinland','Vinland Saga · runes & brume'],['cyberpunk','Cyberpunk · néon & glitch'],['forge','Feu / Forge · braises'],['antique','Antique grec · parchemin'],['cosmos','Cosmos · étoiles'],['ocean','Océan · vagues'],['forest','Forêt · feuilles'],['samurai','Samouraï · sakura'],['matrix','Matrix · pluie de code'],['aurora','Aurore · iridescence']];
var STATS={},KEYS=[];
function syncInterests(){
  if(!Array.isArray(state.interests)||!state.interests.length)state.interests=DEFAULT_INTERESTS.map(function(x){return JSON.parse(JSON.stringify(x))});
  STATS=Object.create(null);KEYS=[];var seen={};
  state.interests.forEach(function(x){if(!x)return;x.id=String(x.id||interestId()).toLowerCase().replace(/[^a-z0-9_-]/g,'_').slice(0,48);if(!x.id||seen[x.id])x.id=interestId();seen[x.id]=1;x.label=String(x.label||x.name||x.id).slice(0,32);x.hex=/^#[0-9a-f]{6}$/i.test(x.hex||'')?x.hex:'#7c5cff';x.theme=THEMES.some(function(t){return t[0]===x.theme})?x.theme:'cosmos';x.emoji=String(x.emoji||'').slice(0,8);x.titles=Array.isArray(x.titles)&&x.titles.length?x.titles:['Débutant','Adepte','Expert','Maître','Légende','Mythe'];STATS[x.id]=x;KEYS.push(x.id)});
}
function interestTotal(){var total=0;KEYS.forEach(function(k){if(typeof state.xp[k]==='number'&&isFinite(state.xp[k]))total+=Math.max(0,state.xp[k])});return total}
function interestId(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

var TYPES={journaliere:'Journalière',commune:'Commune',epique:'Épique',legendaire:'Légendaire'};
var JOURS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
/* Les jours internes (planning et quêtes) sont indexés du lundi (0) au dimanche (6). */
var JC=['L','M','M','J','V','S','D'];
var KEY='jdlv2';
var state,viewDay,currentView='today',questFilter='commune',statRange=7,schedDay=(new Date().getDay()+6)%7,tmp={};

function el(i){return document.getElementById(i)}
function pad(n){return n<10?'0'+n:''+n}
function dateKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return dateKey(d)}
function localDayIndex(d){return (d.getDay()+6)%7}
function uid(){return 'q'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&','<':'<','>':'>','"':'"'}[c]})}
function toast(m){var t=el('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1800)}
function dot(k){var m=STATS[k];return '<span class="dot" style="background:'+(m?m.hex:'#8a90b4')+'"></span>'}

/* Niveaux : niveau n demande 100*n XP pour passer au suivant */
function levelOf(xp){var l=1,need=100;xp=Math.max(0,xp);while(xp>=need){xp-=need;l++;need=100*l}return{lv:l,cur:xp,need:need}}
function titleOf(k,lv){var t=(STATS[k]&&STATS[k].titles)||['Niveau'];return t[Math.min(t.length-1,Math.floor((lv-1)/10))]}
function overallTitle(lv){var t=['Initié','Aventurier','Vétéran','Héros','Légende','Mythe'];return t[Math.min(t.length-1,Math.floor((lv-1)/10))]}

function defaultState(){
  return{player:'Joueur',interests:DEFAULT_INTERESTS.map(function(x){return JSON.parse(JSON.stringify(x))}),quests:[],xp:{sport:0,meditation:0,philosophie:0,electronique:0},
    log:[],checks:{},penalties:{},lastPenaltyCheck:dateKey(),
    schedule:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]}}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function normalize(){
  if(!state||typeof state!=='object')state=defaultState();
  var d=defaultState();for(var k in d){if(state[k]===undefined)state[k]=d[k]}
  if(!state.xp||typeof state.xp!=='object'||Array.isArray(state.xp))state.xp={};
  if(!Array.isArray(state.quests))state.quests=[];if(!Array.isArray(state.log))state.log=[];
  if(!state.checks||typeof state.checks!=='object')state.checks={};if(!state.penalties||typeof state.penalties!=='object')state.penalties={};
  if(state._weekdayIndexVersion!==1){state.quests=state.quests.map(function(q){if(q.days&&q.days.length)q.days=q.days.map(function(day){return (day+6)%7});return q});state._weekdayIndexVersion=1}
  syncInterests();
  KEYS.forEach(function(key){if(typeof state.xp[key]!=='number'||!isFinite(state.xp[key]))state.xp[key]=0});
  for(var sd=0;sd<7;sd++)if(!state.schedule[sd])state.schedule[sd]=[];
  state.quests.forEach(function(q){if(!q.id)q.id=uid();if(!TYPES[q.type])q.type='commune';if(typeof q.xp!=='number'||isNaN(q.xp))q.xp=10;
    if(!Array.isArray(q.stats))q.stats=q.stat?[q.stat]:['sport'];q.stats=q.stats.filter(function(x){return !!STATS[x]});if(!q.stats.length)q.stats=[KEYS[0]];
    if(!Array.isArray(q.days)||!q.days.length)q.days=[0,1,2,3,4,5,6];if(!q.created)q.created=dateKey();
  });
  state.log=state.log.filter(function(e){return !!e&&typeof e==='object'}).map(function(e){if(!Array.isArray(e.stats))e.stats=[];if(typeof e.xp!=='number'||!isFinite(e.xp))e.xp=0;if(typeof e.date!=='string')e.date='';return e});
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{state=JSON.parse(raw)}catch(e){state=null}}
  if(!state){
    state=defaultState();
    /* tentative de récupération d'anciennes données */
    try{
      for(var i=0;i<localStorage.length;i++){
        var kk=localStorage.key(i);
        if(kk===KEY)continue;
        var v=JSON.parse(localStorage.getItem(kk));
        if(v&&typeof v==='object'&&(v.quests||v.tasks||v.missions)){importData(v,true);break}
      }
    }catch(e){}
  }
  normalize();
}

/* Ancien format → nouveau */
function importData(o,silent){
  if(!o||typeof o!=='object')throw new Error('Import invalide');
  var base=defaultState(),old=o.quests||o.tasks||o.missions||[];
  /* Un export récent porte explicitement l’index lundi=0 ; les anciens seront migrés. */
  if(o._weekdayIndexVersion===1)base._weekdayIndexVersion=1;
  if(o.player&&typeof o.player==='string')base.player=o.player;else if(o.name)base.player=o.name;
  if(Array.isArray(o.interests)&&o.interests.length)base.interests=o.interests.map(function(x){return {id:String(x.id||x.key||interestId()),label:x.label||x.name||x.id,hex:x.hex||x.color,theme:x.theme||'cosmos',emoji:x.emoji||x.icon||'',titles:x.titles}});
  var map={daily:'journaliere',journaliere:'journaliere',easy:'journaliere',facile:'journaliere',commune:'commune',common:'commune',normal:'commune',moyenne:'commune',epique:'epique','épique':'epique',epic:'epique',dure:'epique',hard:'epique',legendaire:'legendaire','légendaire':'legendaire',legendary:'legendaire',difficile:'legendaire'};
  var nameMap={Sport:'sport','Méditation':'meditation',Meditation:'meditation','Philosophie':'philosophie','Électronique':'electronique',Electronique:'electronique'};
  if(o.xp&&typeof o.xp==='object')Object.keys(o.xp).forEach(function(k){if(typeof o.xp[k]==='number'&&isFinite(o.xp[k]))base.xp[k]=o.xp[k]});
  if(Array.isArray(o.log))base.log=o.log.map(function(e){if(!e||typeof e!=='object')return e;var z=Object.assign({},e);if(Array.isArray(z.stats))z.stats=z.stats.map(function(k){return nameMap[k]||k});return z});if(o.checks)base.checks=o.checks;if(o.penalties)base.penalties=o.penalties;if(o.schedule)base.schedule=o.schedule;
  base.quests=(Array.isArray(old)?old:[]).map(function(q){var t=String(q.type||q.difficulty||q.diff||'').toLowerCase(),cats=q.stats||q.cats||(q.stat?[q.stat]:(q.cat?[q.cat]:[]));if(!Array.isArray(cats))cats=[cats];cats=cats.map(function(c){return nameMap[c]||c});
    return{id:q.id||uid(),title:q.title||q.name||q.text||'Quête',type:map[t]||'commune',xp:+q.xp||+q.points||10,stats:cats,days:q.days,done:!!q.done,doneAt:q.doneAt,created:q.created};});
  state=base;normalize();save();if(!silent)renderAll();
}
/* Appliquer les pénalités des jours passés (-5 XP par journalière active non cochée) */
function activeOn(q,key){
  if(q.type!=='journaliere')return false;
  if(key<q.created)return false;
  return q.days.indexOf(localDayIndex(parseKey(key)))>=0;
}
function isChecked(id,key){return !!(state.checks[key]&&state.checks[key][id])}
function applyPenalties(){
  var today=dateKey(),from=state.lastPenaltyCheck||today,k=from,guard=0;
  while(k<today&&guard<400){
    state.quests.forEach(function(q){
      if(activeOn(q,k)&&!isChecked(q.id,k)){
        var pk=k+'|'+q.id;
        if(!state.penalties[pk]){
          state.penalties[pk]=1;
          q.stats.forEach(function(s){state.xp[s]=Math.max(0,state.xp[s]-5)});
          state.log.push({date:k,xp:-5,stats:q.stats.slice(),title:q.title,pen:1});
        }
      }
    });
    k=addDays(k,1);guard++;
  }
  state.lastPenaltyCheck=today;save();
}

/* Gain / perte d'XP */
function gain(q,sign,key){
  q.stats.forEach(function(s){if(!STATS[s])return;
    var before=levelOf(state.xp[s]||0).lv;
    state.xp[s]=Math.max(0,(state.xp[s]||0)+sign*q.xp);
    var after=levelOf(state.xp[s]).lv;
    if(sign>0&&after>before)toast(STATS[s].label+' niveau '+after+' ★');
  });
  if(sign>0)state.log.push({date:key,xp:q.xp,stats:q.stats.slice(),title:q.title,qid:q.id});
  else{
    for(var i=state.log.length-1;i>=0;i--){
      if(state.log[i].qid===q.id&&state.log[i].date===key&&!state.log[i].pen){state.log.splice(i,1);break}
    }
  }
}
function toggleDaily(id,key){
  var q=state.quests.filter(function(x){return x.id===id})[0];
  if(!q)return;
  if(!state.checks[key])state.checks[key]={};
  if(state.checks[key][id]){delete state.checks[key][id];gain(q,-1,key)}
  else{state.checks[key][id]=1;gain(q,1,key)}
  save();renderAll();
}
function completeQuest(id){
  var q=state.quests.filter(function(x){return x.id===id})[0];
  if(!q||q.done)return;
  q.done=true;q.doneAt=dateKey();gain(q,1,q.doneAt);save();renderAll();
}
function restoreQuest(id){
  var q=state.quests.filter(function(x){return x.id===id})[0];
  if(!q||!q.done)return;
  gain(q,-1,q.doneAt||dateKey());q.done=false;q.doneAt=null;save();renderAll();
}

function deleteInterest(id){
  var x=STATS[id];if(!x)return;
  if(KEYS.length<2){toast('Conserve au moins un centre');return}
  var used=state.quests.some(function(q){return q.stats.indexOf(id)>=0});
  var target=null;
  if(used){var options=KEYS.filter(function(k){return k!==id}).map(function(k,i){return (i+1)+'. '+STATS[k].label}).join('\n');
    var answer=prompt('Des quêtes utilisent « '+x.label+' ». Entrez le numéro du centre de réaffectation, ou laissez vide pour supprimer ces quêtes.\n'+options,'1');
    if(answer===null)return;var n=parseInt(answer,10);if(answer.trim()&&(!n||!KEYS.filter(function(k){return k!==id})[n-1])){toast('Choix invalide');return}if(answer.trim())target=KEYS.filter(function(k){return k!==id})[n-1];
  }
  if(!confirm('Confirmer la suppression de « '+x.label+' » ?'+(used?(target?' Les quêtes et XP seront réaffectées.':' Les quêtes liées seront supprimées.'):'') ))return;
  if(target){state.quests.forEach(function(q){if(q.stats.indexOf(id)>=0)q.stats=q.stats.map(function(k){return k===id?target:k}).filter(function(k,i,a){return a.indexOf(k)===i})});
    var moved=Number(state.xp[id])||0;state.xp[target]=(Number(state.xp[target])||0)+moved;
    state.log.forEach(function(e){if(Array.isArray(e.stats)&&e.stats.indexOf(id)>=0)e.stats=e.stats.map(function(k){return k===id?target:k}).filter(function(k,i,a){return a.indexOf(k)===i})});
  }else{state.quests=state.quests.filter(function(q){return q.stats.indexOf(id)<0});}
  delete state.xp[id];state.interests=state.interests.filter(function(a){return a.id!==id});syncInterests();save();closeSheet();renderAll();toast(target?'Quêtes et progression réaffectées':'Centre supprimé');
}

/* Affichage */
function chipsFor(q){return q.stats.map(function(s){return '<span class="tag">'+dot(s)+esc(STATS[s]?STATS[s].label:s)+'</span>'}).join('')}
function renderHeader(){
  el('hName').textContent=state.player;
  var tot=interestTotal();
  var o=levelOf(tot);
  el('hSub').textContent='Niveau '+o.lv+' · '+overallTitle(o.lv);
}
function renderToday(){
  var today=dateKey(),isToday=viewDay===today;
  var d=parseKey(viewDay);
  el('dayLabel').innerHTML=(isToday?'Aujourd\'hui':JOURS[d.getDay()])+'<div class="mut">'+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+'</div>';
  var list=state.quests.filter(function(q){return activeOn(q,viewDay)});
  var done=list.filter(function(q){return isChecked(q.id,viewDay)}).length;
  el('dayProg').textContent=done+' / '+list.length+' quêtes';
  var xpd=0;list.forEach(function(q){if(isChecked(q.id,viewDay))xpd+=q.xp});
  el('dayXp').textContent='+'+xpd+' XP aujourd\'hui · -5 XP par quête manquée';
  el('dayBar').style.width=(list.length?done/list.length*100:0)+'%';
  var h='';
  list.forEach(function(q){
    var c=isChecked(q.id,viewDay),failed=!c&&viewDay<today;
    h+='<div class="item'+(c?' done':'')+(failed?' fail':'')+'"><button class="chk" data-chk="'+q.id+'">'+(c?'✓':(failed?'✕':''))+'</button>'+
      '<div class="sp"><div class="t">'+esc(q.title)+'</div><div>'+chipsFor(q)+'</div></div>'+
      '<div class="xp">+'+q.xp+'</div><button class="mini" data-edit="'+q.id+'">✎</button></div>';
  });
  el('dailyList').innerHTML=h||'<div class="empty">Aucune journalière ce jour.<br>Appuie sur + pour en créer.</div>';
  var sl=state.schedule[localDayIndex(d)]||[],sh='';
  sl.forEach(function(s){sh+='<div class="slot"><div class="h">'+s.start+' – '+s.end+'</div><div class="l">'+esc(s.name||s.label||'Créneau')+'</div></div>'});
  el('daySched').innerHTML=sh||'<div class="empty">Rien de prévu.</div>';
}
function renderQuests(){
  var bs=el('questSeg').querySelectorAll('button');
  for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-f')===questFilter?'on':'';
  var list;
  if(questFilter==='archives')list=state.quests.filter(function(q){return q.type!=='journaliere'&&q.done});
  else list=state.quests.filter(function(q){return q.type===questFilter&&!q.done});
  var h='';
  list.forEach(function(q){
    h+='<div class="item'+(q.done?' done':'')+'">'+
      (q.done?'<div class="chk">✓</div>':'<button class="chk" data-complete="'+q.id+'"></button>')+
      '<div class="sp"><div class="t">'+esc(q.title)+'</div><div><span class="tag">'+TYPES[q.type]+'</span>'+chipsFor(q)+'</div></div>'+
      '<div class="xp">+'+q.xp+'</div>'+
      (q.done?'<button class="mini" data-restore="'+q.id+'">↺</button>':'<button class="mini" data-edit="'+q.id+'">✎</button>')+'</div>';
  });
  el('questList').innerHTML=h||'<div class="empty">'+(questFilter==='archives'?'Aucune quête archivée.':'Aucune quête ici.<br>Appuie sur + pour en créer.')+'</div>';
}
function renderProfile(){
  var tot=interestTotal(),o=levelOf(tot);
  el('ovLv').textContent='Niv. '+o.lv;el('ovTi').textContent=overallTitle(o.lv)+' · '+state.player;el('ovLv').parentNode.className='big'+(o.lv>=30?' high':'');
  el('ovBar').style.width=(o.cur/o.need*100)+'%';el('ovXp').textContent=o.cur+' / '+o.need+' XP · total '+tot;
  var h='';KEYS.forEach(function(k){var m=STATS[k],l=levelOf(state.xp[k]);
    h+='<div class="stat" data-theme="'+m.theme+'" style="--interest:'+m.hex+'"><div class="top"><span>'+dot(k)+'<b class="interest-title">'+esc(m.emoji||'')+' '+esc(m.label)+'</b> · '+esc(titleOf(k,l.lv))+'</span><span>Niv. '+l.lv+'</span></div><div class="bar"><i style="width:'+(l.cur/l.need*100)+'%;background:'+m.hex+'"></i></div><div class="mut" style="margin-top:3px">'+l.cur+' / '+l.need+' XP</div></div>';
  });el('statList').innerHTML=h||'<div class="empty">Ajoute ton premier centre d’intérêt.</div>';
}
function buckets(){
  var n=statRange,today=dateKey(),start=addDays(today,-(n-1)),step=n<=31?1:(n<=100?7:30),res=[];
  for(var i=0;i<n;i+=step){
    var b={from:addDays(start,i),to:addDays(start,Math.min(n-1,i+step-1)),v:(function(){var z={};KEYS.forEach(function(k){z[k]=0});return z})()};
    res.push(b);
  }
  state.log.forEach(function(e){
    if(e.date<start||e.date>today||e.xp<0)return;
    for(var j=0;j<res.length;j++){
      if(e.date>=res[j].from&&e.date<=res[j].to){
        e.stats.forEach(function(s){if(res[j].v[s]!==undefined)res[j].v[s]+=e.xp});break;
      }
    }
  });
  return res;
}
function renderStats(){
  var bs=el('rangeSeg').querySelectorAll('button');
  for(var i=0;i<bs.length;i++)bs[i].className=parseInt(bs[i].getAttribute('data-r'),10)===statRange?'on':'';
  var b=buckets(),lg='',tot={};KEYS.forEach(function(k){tot[k]=0});var all=0;
  b.forEach(function(x){KEYS.forEach(function(k){tot[k]+=x.v[k];all+=x.v[k]})});
  KEYS.forEach(function(k){lg+='<span>'+dot(k)+esc(STATS[k].label)+'</span>'});
  el('chartLegend').innerHTML=lg;
  var sh='<div class="stat"><div class="top"><span><b>Total période</b></span><span>'+all+' XP</span></div></div>';
  KEYS.forEach(function(k){sh+='<div class="stat"><div class="top"><span>'+dot(k)+STATS[k].label+'</span><span>'+tot[k]+' XP</span></div></div>'});
  el('sumBox').innerHTML=sh;
  drawChart(b);
}
function drawChart(b){
  b=b||buckets();
  var cv=el('chart'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  if(!W)return;
  cv.width=W*dpr;cv.height=H*dpr;
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  var padL=34,padR=6,padT=8,padB=22,cw=W-padL-padR,ch=H-padT-padB,max=10;
  b.forEach(function(x){var s=0;KEYS.forEach(function(k){s+=x.v[k]});if(s>max)max=s});
  c.font='10px sans-serif';c.fillStyle='#8a90b4';c.strokeStyle='#2c3252';c.lineWidth=1;
  for(var g=0;g<=4;g++){
    var gy=padT+ch-(g/4)*ch;
    c.beginPath();c.moveTo(padL,gy);c.lineTo(W-padR,gy);c.stroke();
    c.fillText(Math.round(max*g/4),2,gy+3);
  }
  var bw=cw/b.length,barW=Math.max(2,bw*0.7);
  for(var x=0;x<b.length;x++){
    var bx=padL+x*bw+(bw-barW)/2,yy=padT+ch;
    KEYS.forEach(function(k){
      var v=b[x].v[k];if(!v)return;
      var h=v/max*ch;yy-=h;c.fillStyle=STATS[k].hex;c.fillRect(bx,yy,barW,h);
    });
    if(b.length<=10||x%Math.ceil(b.length/6)===0){
      var dd=parseKey(b[x].from);c.fillStyle='#8a90b4';c.textAlign='center';
      c.fillText(dd.getDate()+'/'+(dd.getMonth()+1),bx+barW/2,H-6);c.textAlign='left';
    }
  }
}
var DAYN=['L','M','M','J','V','S','D'];
var DAYF=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

function renderPlan(){
  if(!state.schedule)state.schedule={};
  for(var i=0;i<7;i++)if(!state.schedule[i])state.schedule[i]=[];

  /* Sélecteur de jours */
  var h='';
  for(var d=0;d<7;d++)h+='<button data-d="'+d+'" class="'+(d===schedDay?'on':'')+'">'+DAYN[d]+'</button>';
  el('schedDays').innerHTML=h;

  /* Créneaux du jour choisi */
  var list=state.schedule[schedDay].slice().sort(function(a,b){return a.start<b.start?-1:1});
  var out='<div style="font-size:12px;color:var(--mut);margin-bottom:8px">'+DAYF[schedDay]+'</div>';
  if(!list.length)out+='<div style="color:var(--mut);font-size:13px;text-align:center;padding:14px">Aucun créneau</div>';
  list.forEach(function(s){
    out+='<div class="slot"><div class="t">'+s.start+' – '+s.end+'</div><div class="n">'+esc(s.name||s.label||'Créneau')+'</div><button class="x" data-slotdel="'+s.id+'">✕</button></div>';
  });
  el('schedList').innerHTML=out;
}
function renderAll(){renderHeader();renderToday();renderQuests();renderProfile();renderStats();renderPlan()}
function showView(v){
  currentView=v;
  var vs=document.querySelectorAll('.view');
  for(var i=0;i<vs.length;i++)vs[i].classList.toggle('on',vs[i].id==='v-'+v);
  var nb=el('nav').querySelectorAll('button');
  for(var j=0;j<nb.length;j++)nb[j].classList.toggle('on',nb[j].getAttribute('data-v')===v);
  window.scrollTo(0,0);
  if(v==='stats')setTimeout(function(){drawChart()},30);
}

/* Événements */
el('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(b)showView(b.getAttribute('data-v'))});
el('dayPrev').onclick=function(){viewDay=addDays(viewDay,-1);renderToday()};
el('dayNext').onclick=function(){if(viewDay<dateKey()){viewDay=addDays(viewDay,1);renderToday()}};
el('dailyList').addEventListener('click',function(e){
  var c=e.target.closest('[data-chk]');if(c){toggleDaily(c.getAttribute('data-chk'),viewDay);return}
  var m=e.target.closest('[data-edit]');if(m)questForm(m.getAttribute('data-edit'));
});
el('questList').addEventListener('click',function(e){
  var c=e.target.closest('[data-complete]');if(c){completeQuest(c.getAttribute('data-complete'));return}
  var r=e.target.closest('[data-restore]');if(r){restoreQuest(r.getAttribute('data-restore'));return}
  var m=e.target.closest('[data-edit]');if(m)questForm(m.getAttribute('data-edit'));
});
el('questSeg').addEventListener('click',function(e){var b=e.target.closest('button[data-f]');if(!b)return;questFilter=b.getAttribute('data-f');renderQuests()});
el('rangeSeg').addEventListener('click',function(e){var b=e.target.closest('button[data-r]');if(!b)return;statRange=parseInt(b.getAttribute('data-r'),10);renderStats()});
el('schedDays').addEventListener('click',function(e){var b=e.target.closest('button[data-d]');if(!b)return;schedDay=parseInt(b.getAttribute('data-d'),10);renderPlan()});
el('schedList').addEventListener('click',function(e){
  var x=e.target.closest('[data-slotdel]');if(!x)return;
  var id=x.getAttribute('data-slotdel');
  state.schedule[schedDay]=state.schedule[schedDay].filter(function(s){return s.id!==id});
  save();renderPlan();renderToday();
});
el('btnAddSlot').onclick=slotForm;
el('btnAdd').onclick=function(){
  var t=(currentView==='quests'&&questFilter!=='archives')?questFilter:'journaliere';
  questForm(null,t);
};
el('btnSettings').onclick=openSettings;
el('btnInterests').onclick=manageInterests;
window.addEventListener('resize',function(){if(currentView==='stats')drawChart()});

/* Démarrage */
load();
viewDay=dateKey();
applyPenalties();
renderAll();

/* Si l'appli reste ouverte au passage de minuit */
setInterval(function(){
  var today=dateKey();
  if(state.lastPenaltyCheck!==today){
    if(viewDay===state.lastPenaltyCheck)viewDay=today;
    applyPenalties();renderAll();
  }
},60000);
</script>
